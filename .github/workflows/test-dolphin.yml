name: Test ISO su Dolphin (headless)

# Scarica il .wbfs prodotto da una run PierWFC, lo avvia in Dolphin con un
# display virtuale e salva screenshot + log come artifact. Parte solo a mano.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID della run PierWFC che contiene l'artifact"
        type: string
        required: true
      seconds:
        description: "Secondi di emulazione"
        type: string
        default: "420"

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Scarica ISO (artifact della run)
        uses: actions/download-artifact@v4
        with:
          name: retro-rewind-pierwfc-wbfs
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: iso

      - name: Dolphin in container Ubuntu 26.04 (headless)
        run: |
          mkdir -p shots; df -h . | tail -1; ls -la iso
          cat > run.sh <<'INNER'
          set -x
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq dolphin-emu xvfb imagemagick x11-utils xdotool procps openbox mesa-vulkan-drivers libgl1-mesa-dri >/dev/null; dpkg -L dolphin-emu | grep -i bin/ ; export PATH=$PATH:/usr/games
          dolphin-emu --version 2>&1 | head -2
          D=$HOME/.local/share/dolphin-emu; mkdir -p $D/Config
          printf '[Core]\nGFXBackend = Software Renderer\nCPUCore = 1\nDSPHLE = True\nEmulationSpeed = 0.0\nSkipIPL = True\nFastmem = False\n[DSP]\nBackend = No Audio Output\n[Interface]\nConfirmStop = False\n' > $D/Config/Dolphin.ini
          F=$(ls /work/iso/*.wbfs | head -1)
          export LIBGL_ALWAYS_SOFTWARE=1 QT_QPA_PLATFORM=xcb DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 3
          openbox >/dev/null 2>&1 &
          sleep 2
          printf '[Options]\nWriteToFile = True\nVerbosity = 4\nWriteToConsole = True\n[Logs]\nOSREPORT = True\nBOOT = True\nIOS = True\nIOS_NET = True\nIOS_FS = True\nWII_IPC = True\nCOMMON = True\nDVDINTERFACE = True\n' > $D/Config/Logger.ini
          dolphin-emu -b -v "Software Renderer" -e "$F" > /work/dolphin.log 2>&1 &
          DP=$!
          N=$(( SECS / 20 ))
          for i in $(seq 1 $N); do
            sleep 20
            xdotool search --name RMCPTO key --clearmodifiers F9 2>&1 | head -2; top -b -n1 | head -12 | tail -6
            import -window root /work/shots/shot-$(printf %03d $i).png || true
            kill -0 $DP 2>/dev/null || { echo "Dolphin terminato"; break; }
          done
          for w in $(xdotool search --name Dolphin); do xwininfo -id $w | grep -i 'Map State\|Absolute\|Width\|Height\|xwininfo'; done; xwininfo -root -tree | head -30; ps aux | grep -i dolphin | head -3
          kill $DP 2>/dev/null || true
          cp -r $D/Logs /work/shots/ 2>/dev/null; cp -r $D/ScreenShots /work/shots/ss 2>/dev/null; ls -R $D/ScreenShots | head; find $D -maxdepth 2 | head -20
          tail -n 60 /work/dolphin.log
          INNER
          sed -i 's/^          //' run.sh
          docker run --rm --shm-size=4g -e SECS=${{ inputs.seconds }} -v "$PWD":/work ubuntu:26.04 bash /work/run.sh

      - name: Carica risultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-test
          path: |
            shots
            dolphin.log
