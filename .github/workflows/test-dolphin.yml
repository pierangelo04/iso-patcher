name: Test ISO su Dolphin (headless)

# Scarica il .wbfs prodotto da una run PierWFC, lo avvia in Dolphin con un
# display virtuale e salva screenshot + log come artifact. Parte solo a mano.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID della run PierWFC che contiene l'artifact"
        type: string
        required: true
      seconds:
        description: "Secondi di emulazione"
        type: string
        default: "420"

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Scarica ISO (artifact della run)
        uses: actions/download-artifact@v4
        with:
          name: retro-rewind-pierwfc-wbfs
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: iso

      - name: Dolphin in container Ubuntu 26.04 (headless)
        run: |
          mkdir -p shots; df -h . | tail -1; ls -la iso
          cat > run.sh <<'INNER'
          set -x
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq dolphin-emu xvfb imagemagick x11-utils xdotool procps openbox python3 tesseract-ocr mesa-vulkan-drivers libgl1-mesa-dri tcpdump dnsutils libc-bin >/dev/null; for h in q7x.duckdns.org nas.q7x.duckdns.org gpcm.q7x.duckdns.org; do echo DNS $h; getent hosts $h; done 2>&1 | tee /work/shots/dns.txt; (timeout 900 tcpdump -l -nn -i any "port 53 or host 95.135.208.187" > /work/shots/net.txt 2>&1 &) ; dpkg -L dolphin-emu | grep -i bin/ ; export PATH=$PATH:/usr/games
          dolphin-emu --version 2>&1 | head -2
          D=/work/user; mkdir -p $D/Config
          printf '[Core]\nGFXBackend = Software Renderer\nCPUCore = 1\nDSPHLE = True\nEmulationSpeed = 0.0\nSkipIPL = True\n[DSP]\nBackend = No Audio Output\n[Interface]\nConfirmStop = False\n' > $D/Config/Dolphin.ini
          F=$(ls /work/iso/*.wbfs | head -1)
          export LIBGL_ALWAYS_SOFTWARE=1 QT_QPA_PLATFORM=xcb DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 3
          openbox >/dev/null 2>&1 &
          sleep 2
          printf '[Options]\nWriteToFile = True\nVerbosity = 5\nWriteToConsole = True\n[Logs]\nOSREPORT = True\nBOOT = True\nIOS = True\nIOS_NET = True\nIOS_SSL = True\nIOS_WC24 = True\nIOS_DI = False\nIOS_FS = True\nWII_IPC = True\nCOMMON = True\nDVDINTERFACE = True\n' > $D/Config/Logger.ini
          dolphin-emu -u /work/user -b -v "Software Renderer" -e "$F" > /work/dolphin.log 2>&1 &
          DP=$!
          python3 /work/tools/dolphin/drive.py $SECS 2>&1 | tail -5
          for w in $(xdotool search --name Dolphin); do xwininfo -id $w | grep -i 'Map State\|Absolute\|Width\|Height\|xwininfo'; done; xwininfo -root -tree | head -30; ps aux | grep -i dolphin | head -3
          kill $DP 2>/dev/null || true
          mkdir -p /work/shots/nand; cp -r $D/Wii/shared2/sys/net /work/shots/nand/ 2>/dev/null; find $D/Wii -type f | head -80 > /work/shots/nand/files.txt; for f in $(find $D/Wii/shared2/sys/net -type f); do xxd $f | head -60; done > /work/shots/nand/net.hex 2>&1; cp -r $D/Logs /work/shots/ 2>/dev/null; cp -r $D/ScreenShots /work/shots/ss 2>/dev/null; ls -R $D/ScreenShots | head; find $D -maxdepth 2 | head -20
          tail -n 60 /work/dolphin.log
          INNER
          sed -i 's/^          //' run.sh
          docker run --rm --shm-size=4g -e SECS=${{ inputs.seconds }} -v "$PWD":/work ubuntu:26.04 bash /work/run.sh

      - name: Carica risultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-test
          path: |
            shots
            dolphin.log
