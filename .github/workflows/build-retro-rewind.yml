name: Build & upload Retro Rewind ISO

# Workflow automatizzato per ISO Retro Rewind (RetroWFC, NON Wiimmfi).
# Procedura manuale di riferimento (video https://www.youtube.com/watch?v=z5PW9iPkZfQ):
#  1. scarica Retro Rewind full da wiki (rwfc.net) -> RetroRewind6/
#  2. scarica ISO builder "Wiimm Edition for v6.12.5 and above" dal link MEGA
#     nella sidebar wiki (https://mkwiiki.org/wiki/Retro_Rewind)
#  3. installa Wiimm ISO Tools (wit)
#  4. metti Mario Kart Wii .iso/.wbfs nella stessa cartella
#  5. lancia create-rr-pal.bat (PAL) / -usa / -jpn in base alla regione Wii
#  6. prendi il file da new-image/ e trasferiscilo su USB con Wii Backup Manager
#  7. installa il forwarder WAD di Kote3767 e avvia da System Menu (non da HBC)
# Questo workflow replica gli stessi passi su ubuntu-latest per la regione PAL.
#
# FIX 1 - RetroWFC vs Wiimmfi (verificato sui log run 34715396539):
#  il log mostrava `cp: cannot stat './extra/Boot/Loaders/PAL/main.dol'`.
#  Il vecchio copy-files.sh di GitHub usava $SRC_TYPE per scegliere il loader,
#  ma le cartelle sono EUR/USA/JPN (non PAL). Senza loader EUR, l'ISO teneva
#  il main.dol vanilla -> Pulsar/RetroWFC non partiva e l'USB Loader ripiegava
#  sulla patch di default Wiimmfi. MAI usare `wit --patch-wiimmfi`.
#
# FIX 2 - "FATAL ERROR: Incompatible file (version 2), please upgrade your
#  Kamek Loader" su Dolphin (e Wii): il builder su GitHub
#  (Retro-Rewind-Team/iso-patcher -> updatedbuilder.zip, 05/2026) contiene un
#  main.dol con Kamek Loader vecchio, incompatibile con i .pul v2 del pack
#  corrente. La wiki ufficiale dice di usare l'archivio
#  "Retro Rewind ISO Builder Wiimm Edition for v6.12.5 and above.zip" dal link
#  MEGA (https://mega.nz/folder/yW40yJqI#l9RG4RsVWRSwoAVyXpqr4w), che contiene
#  main.dol aggiornati (09/2026), SRC_TYPE=EUR per PAL, riga dolpatch
#  `80005EFC=0000000A` e flag `--security-fix`.
#  PERCIO' QUESTO WORKFLOW SCARICA IL BUILDER DA MEGA, NON DA GITHUB.
#
# NOTA DISPATCH (2026-09-23): quando il workflow e' avviato via
# workflow_dispatch (es. dalla Netlify function check-retro-rewind, che ha
# gia' rilevato un aggiornamento prima di fare dispatch), il job `check`
# SALTA il confronto versioni/SHA e imposta rebuild=true direttamente.
# La verifica completa resta solo per schedule orario, push e dispatch
# con force=false manuale.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forza la ricompilazione anche senza aggiornamenti"
        type: boolean
        required: false
        default: false
      region:
        description: "Regione da buildare"
        type: choice
        required: false
        default: "PAL"
        options:
          - PAL
          - USA
          - JPN
      test_whatsapp:
        description: 'Test solo invio WhatsApp (salta la build, manda un messaggio di prova)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-retro-rewind.yml"

permissions:
  contents: write

env:
  UPSTREAM_REPO: Retro-Rewind-Team/iso-patcher
  PACK_ZIP_URL: https://update.rwfc.net/RetroRewind/zip/RetroRewind.zip
  PACK_VERSION_URL: https://update.rwfc.net/RetroRewind/RetroRewindVersion.txt
  # ISO builder UFFICIALE aggiornato (Kamek Loader v2, fix PAL->EUR):
  # cartella MEGA pubblica linkata dalla wiki. Lo zip contiene
  # "Retro Rewind ISO Builder/Retro Rewind ISO Builder Wiimm Edition for v6.12.5 and above.zip".
  BUILDER_MEGA_LINK: https://mega.nz/folder/yW40yJqI#l9RG4RsVWRSwoAVyXpqr4w
  BUILDER_ZIP: Retro Rewind ISO Builder Wiimm Edition for v6.12.5 and above.zip
  BUILDER_SUBDIR: Retro Rewind ISO Builder
  # md5 del main.dol EUR VECCHIO (GitHub 05/2026, Kamek v1): se il builder
  # scaricato lo contiene ancora, la build deve fallire invece di produrre
  # una ISO con "Incompatible file (version 2)".
  OLD_LOADER_MD5_EUR: 5f8e596c3b500aaa267888f4c9ae3cd8
  # Base ISO PAL (deve contenere RMCP01). NON piu' da archive.org:
  # la ISO originale va caricata su MEGA nella cartella /iso-originale/
  # (es. /iso-originale/MarioKart.iso). Se MEGA_ISO_NAME e' vuoto,
  # il workflow prende automaticamente il primo .iso trovato nella cartella.
  MEGA_ISO_DIR: /iso-originale
  MEGA_ISO_NAME: ""
  WIT_URL: https://wit.wiimm.de/download/wit-v3.05a-r8638-x86_64.tar.gz
  STATE_FILE: runtime/state.txt
  # UNICO output dalla workdir patchata, valido per ENTRAMBI i target
  # (Dolphin legge i .wbfs nativamente, i loader Wii li usano di default).
  # Nome file datato del giorno build: "Mario Kart Wii(Retro Rewind)-
  # Aggiornamento DD-MM-YYYY.wbfs" (calcolato nello step di build e passato
  # agli step successivi via GITHUB_ENV; il GameID interno resta RMCPTO).
  # Dopo la build il file viene caricato su Google Drive (account dedicatoai,
  # link pubblico nel messaggio WhatsApp). L'upload su MEGA e' stato rimosso.
  OUTPUT_WBFS: RMCPTO.wbfs

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      rebuild: ${{ steps.check.outputs.rebuild }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      pack_fp: ${{ steps.check.outputs.pack_fp }}
      pack_version: ${{ steps.check.outputs.pack_version }}
      builder_fp: ${{ steps.check.outputs.builder_fp }}
      region: ${{ steps.check.outputs.region }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installa MEGAcmd (per fingerprint builder)
        shell: bash
        run: |
          if ! command -v mega-ls >/dev/null 2>&1; then
            source /etc/os-release
            DEB="megacmd-xUbuntu_${VERSION_ID}_amd64.deb"
            wget -q "https://mega.nz/linux/repo/xUbuntu_${VERSION_ID}/amd64/${DEB}" -O "/tmp/${DEB}"
            sudo apt install -y "/tmp/${DEB}"
          fi
          mega-ls --version 2>&1 | head -n2 || true

      - name: Rileva aggiornamenti (patcher / pack / builder)
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MEGA_USERNAME: ${{ secrets.MEGA_USERNAME }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -uo pipefail
          UP_SHA=$(gh api "repos/$UPSTREAM_REPO/commits/main" --jq .sha 2>/dev/null \
                   || curl -fsSL "https://api.github.com/repos/$UPSTREAM_REPO/commits/main" 2>/dev/null | jq -r .sha 2>/dev/null \
                   || true)
          PACK_FP=$(curl -fsSL "$PACK_VERSION_URL" 2>/dev/null | tr -d ' \t\r' | sort | sha256sum | awk '{print $1}')
          VER=$(curl -fsSL "$PACK_VERSION_URL" 2>/dev/null | sed '/^$/d' | tail -n1 | awk '{print $1}')
          # Fingerprint del builder MEGA (listing nomi+date+dimesioni): se Kote
          # aggiorna l'ISO Builder, la build riparte. Se il listing fallisce
          # (es. secret mancanti), riusa il valore salvato -> neutro, nessun rebuild.
          STORED_BUILDER_FP=$(awk '{print $3}' "$STATE_FILE" 2>/dev/null || true)
          BUILDER_FP="${STORED_BUILDER_FP:-no-mega}"
          if [ -n "${MEGA_USERNAME:-}" ] && [ -n "${MEGA_PASSWORD:-}" ]; then
            mega-login "$MEGA_USERNAME" "$MEGA_PASSWORD" >/dev/null 2>&1 || true
            if MEGA_LS=$(mega-ls -l "$BUILDER_MEGA_LINK" 2>/dev/null) && [ -n "$MEGA_LS" ]; then
              BUILDER_FP=$(printf '%s' "$MEGA_LS" | sha256sum | awk '{print $1}')
            fi
            mega-logout >/dev/null 2>&1 || true
          fi
          LAST=$(cat "$STATE_FILE" 2>/dev/null || true)
          FORCE="${{ github.event.inputs.force }}"
          REGION_IN="${{ github.event.inputs.region }}"
          REGION="${REGION_IN:-PAL}"
          PACK_FP=${PACK_FP:-no-ver}
          VER=${VER:-unknown}

          echo "upstream_sha=$UP_SHA" >> "$GITHUB_OUTPUT"
          echo "pack_fp=$PACK_FP" >> "$GITHUB_OUTPUT"
          echo "pack_version=$VER" >> "$GITHUB_OUTPUT"
          echo "builder_fp=$BUILDER_FP" >> "$GITHUB_OUTPUT"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"

          if [ -z "$UP_SHA" ]; then
            echo "Impossibile contattare l'API di GitHub, controllo saltato." >> "$GITHUB_STEP_SUMMARY"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Nota: al momento la build automatica supporta solo PAL (la ISO su MEGA
          # in /iso-originale deve contenere RMCP01). Se viene richiesta USA/JPN,
          # falliamo presto con messaggio chiaro.
          if [ "$REGION" != "PAL" ]; then
            echo "## Regione non supportata in automatico" >> "$GITHUB_STEP_SUMMARY"
            echo "Richesta regione \`$REGION\`, ma la ISO su MEGA e' PAL (RMCP01)." >> "$GITHUB_STEP_SUMMARY"
            echo "Usa PAL oppure carica in /iso-originale una ISO RMCE01/RMCJ01." >> "$GITHUB_STEP_SUMMARY"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip verifica aggiornamenti quando il run e' avviato via
          # workflow_dispatch (es. dalla Netlify function check-retro-rewind,
          # che ha gia' rilevato un aggiornamento prima di fare dispatch):
          # si builda direttamente senza confrontare versioni/SHA.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Dispatch via workflow_dispatch: build diretta"
              echo "Verifica aggiornamenti saltata (gia' fatta dal chiamante)."
              echo "- Pack Retro Rewind v$VER, regione \`$REGION\` (RetroWFC, non Wiimmfi)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$FORCE" = "true" ] || [ -z "$LAST" ] || [ "$LAST" != "$UP_SHA $PACK_FP $BUILDER_FP" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Rilevato un aggiornamento, ricompilo"
              echo "- Patcher GitHub: \`$UP_SHA\`"
              echo "- Pack Retro Rewind v$VER (impronta \`${PACK_FP:0:8}\`)"
              echo "- Builder MEGA (impronta \`${BUILDER_FP:0:8}\`)"
              echo "- Regione: \`$REGION\` (RetroWFC, non Wiimmfi)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "Nessun aggiornamento per patcher, pack o builder, build saltata." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: check
    if: needs.check.outputs.rebuild == 'true' && github.event.inputs.test_whatsapp != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      download_url: ${{ steps.drive.outputs.download_url }}
      wbfs_name: ${{ steps.wbfsname.outputs.wbfs_name }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Installa wit (Wiimms ISO Tools)
        run: |
          curl -fsSL -o /tmp/wit.tar.gz "$WIT_URL"
          tar xzf /tmp/wit.tar.gz -C /tmp
          WITDIR=$(ls -d /tmp/wit-v3.05a* | head -n1)
          sudo install -m755 "$WITDIR/bin/wit" /usr/local/bin/wit
          wit --version

      - name: Installa MEGAcmd
        shell: bash
        run: |
          if ! command -v mega-get >/dev/null 2>&1; then
            source /etc/os-release
            DEB="megacmd-xUbuntu_${VERSION_ID}_amd64.deb"
            wget -q "https://mega.nz/linux/repo/xUbuntu_${VERSION_ID}/amd64/${DEB}" -O "/tmp/${DEB}"
            sudo apt install -y "/tmp/${DEB}"
          fi
          mega-get --version 2>&1 | head -n2 || true

      - name: Prepara il patcher (ISO Builder v6.12.5+ da MEGA)
        shell: bash
        run: |
          set -euxo pipefail
          # Link pubblico (anonimo, nessun login): contiene SEMPRE il builder
          # aggiornato con Kamek Loader v2. Quello su GitHub e' obsoleto (v1).
          # NOTA: mega-get esige una cartella di destinazione ESISTENTE.
          rm -rf /tmp/megabuilder
          mkdir -p /tmp/megabuilder
          mega-get "$BUILDER_MEGA_LINK" /tmp/megabuilder
          ls -R /tmp/megabuilder | head -n 30
          unzip -q -o "/tmp/megabuilder/$BUILDER_SUBDIR/$BUILDER_ZIP"
          chmod a+x *.sh
          ls -R extra/Boot/Loaders
          test -f extra/Boot/Loaders/EUR/main.dol
          test -f copy-files.sh
          grep -q "80005EFC" copy-files.sh || (echo "::error::copy-files.sh senza riga dolpatch 80005EFC: builder obsoleto?"; exit 1)
          # Guardia Kamek v2: rifiuta il vecchio main.dol GitHub (Kamek v1),
          # che produrrebbe "Incompatible file (version 2)" su Dolphin/Wii.
          GOT_MD5=$(md5sum extra/Boot/Loaders/EUR/main.dol | awk '{print $1}')
          echo "main.dol EUR md5=$GOT_MD5"
          if [ "$GOT_MD5" = "$OLD_LOADER_MD5_EUR" ]; then
            echo "::error::main.dol EUR ancora quello vecchio (Kamek v1). Builder MEGA non aggiornato?"
            exit 1
          fi
          rm -rf /tmp/megabuilder

      - name: Scarica il pack Retro Rewind (full, RetroWFC)
        run: |
          curl -fL --retry 5 --retry-all-errors -C - -A "Mozilla/5.0" -o RetroRewind.zip "$PACK_ZIP_URL"
          unzip -q RetroRewind.zip 'RetroRewind6/*'
          rm -f RetroRewind.zip
          du -sh RetroRewind6
          test -f RetroRewind6/UI/Title.szs
          test -f RetroRewind6/Binaries/Code.pul
          test -f RetroRewind6/Binaries/Loader.pul
          echo "Pack OK: Code.pul + Loader.pul presenti (Pulsar/RetroWFC)"

      - name: Scarica ISO base da MEGA (PAL, RMCP01)
        shell: bash
        env:
          MEGA_USERNAME: ${{ secrets.MEGA_USERNAME }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -euxo pipefail
          if [ -z "${MEGA_USERNAME:-}" ] || [ -z "${MEGA_PASSWORD:-}" ]; then
            echo "::error::Secrets MEGA_USERNAME/MEGA_PASSWORD mancanti. Impostali in Settings > Secrets."
            exit 1
          fi
          # MEGAcmd gia' installato nello step dedicato; qui serve solo il login
          # per la cartella privata /iso-originale (il builder sopra e' pubblico).
          mega-login "$MEGA_USERNAME" "$MEGA_PASSWORD"
          echo "--- Contenuto di $MEGA_ISO_DIR ---"
          mega-ls -l "$MEGA_ISO_DIR"
          # Nome file: da MEGA_ISO_NAME oppure primo .iso trovato nella cartella
          if [ -n "${MEGA_ISO_NAME:-}" ]; then
            REMOTE_FILE="$MEGA_ISO_DIR/$MEGA_ISO_NAME"
          else
            PICK=$(mega-ls "$MEGA_ISO_DIR" | grep -i '\.iso$' | head -n1 | tr -d '\r' | xargs || true)
            if [ -n "$PICK" ]; then PICK=$(basename "$PICK"); fi
            if [ -z "$PICK" ]; then
              echo "::error::Nessun file .iso trovato in $MEGA_ISO_DIR su MEGA."
              exit 1
            fi
            REMOTE_FILE="$MEGA_ISO_DIR/$PICK"
          fi
          echo "Scarico $REMOTE_FILE -> MarioKart.iso"
          mega-get "$REMOTE_FILE" ./MarioKart.iso
          mega-logout || true
          ls -lh MarioKart.iso
          # NOTA: `wit INFO` stampa keywords interne, NON le ISO. Per le ISO usare LIST/ID6.
          wit LIST MarioKart.iso 2>&1 | head -n 30
          wit ID6 MarioKart.iso 2>&1 | grep -q "RMCP01" || (echo "::error::La ISO base da MEGA non contiene RMCP01 (PAL). Controlla il file in $MEGA_ISO_DIR."; exit 1)

      - name: Compila l'ISO patchata (PAL -> loader EUR, RetroWFC)
        shell: bash
        run: |
          set -euxo pipefail
          df -h .
          rm -rf workdir.tmp new-image
          wit extract MarioKart.iso --DEST workdir.tmp --psel data --links --include RMCP01 -vv1 -F-.svn/
          test -d workdir.tmp
          test -f workdir.tmp/setup.txt
          rm -f MarioKart.iso
          # --- FIX RetroWFC: PAL usa il loader EUR (come create-rr-pal.bat BASEVER=EUR).
          # copy-files.sh con SRC_TYPE=PAL cercherebbe extra/Boot/Loaders/PAL/main.dol
          # che NON esiste -> main.dol vanilla -> online su Wiimmfi invece di RetroWFC.
          # Usiamo quindi SRC_TYPE=EUR e verifichiamo con cmp.
          ls -lh "extra/Boot/Loaders/EUR/main.dol"
          SRC_TYPE=EUR ./copy-files.sh 2>&1 | tee /tmp/copyfiles.log
          echo "--- Verifica loader Retro (builder v6.12.5+: dolpatch 80005EFC in-place) ---"
          ls -lh workdir.tmp/sys/main.dol extra/Boot/Loaders/EUR/main.dol extra/thp/bi2.bin workdir.tmp/sys/bi2.bin
          # Il builder nuovo applica `wit dolpatch main.dol 80005EFC=0000000A`
          # DOPO la copia: stesso file, stessa dimensione, ma alcuni byte
          # patchati. Quindi: dimensioni uguali + file DIVERSI + "Patched:" nel log.
          [ "$(stat -c%s workdir.tmp/sys/main.dol)" = "$(stat -c%s extra/Boot/Loaders/EUR/main.dol)" ] \
            || (echo "::error::main.dol di dimensione inattesa"; exit 1)
          grep -q "Patched:" /tmp/copyfiles.log \
            || (echo "::error::dolpatch 80005EFC NON eseguito da copy-files.sh"; exit 1)
          if cmp -s workdir.tmp/sys/main.dol extra/Boot/Loaders/EUR/main.dol; then
            echo "::error::main.dol identico all'originale: dolpatch NON applicato"
            exit 1
          fi
          echo "Byte patchati (attesi: pochi, intorno alla patch 80005EFC):"
          # NOTA: `cmp` esce 1 se i file differiscono (caso atteso qui!):
          # con `set -e + pipefail` va gestito a mano, non in pipeline.
          set +e
          cmp -l workdir.tmp/sys/main.dol extra/Boot/Loaders/EUR/main.dol > /tmp/cmpdiff.txt
          CMP_RC=$?
          set -e
          head -n 40 /tmp/cmpdiff.txt
          NDIFF=$(wc -l < /tmp/cmpdiff.txt | tr -d '[:space:]')
          echo "Totale byte diversi: $NDIFF (cmp exit=$CMP_RC)"
          [ "$NDIFF" -ge 1 ] && [ "$NDIFF" -le 32 ] \
            || (echo "::error::differenze main.dol anomale ($NDIFF byte): builder cambiato?"; exit 1)
          # Mai il vecchio loader v1 (darebbe "Incompatible file (version 2)")
          [ "$(md5sum workdir.tmp/sys/main.dol | awk '{print $1}')" != "$OLD_LOADER_MD5_EUR" ] \
            || (echo "::error::main.dol ancora quello vecchio (Kamek v1)"; exit 1)
          cmp workdir.tmp/sys/bi2.bin extra/thp/bi2.bin || (echo "::error::bi2.bin NON sostituito"; exit 1)
          echo "--- Verifica file Retro Rewind in workdir ---"
          test -f workdir.tmp/files/Binaries/Code.pul
          test -f workdir.tmp/files/Binaries/Loader.pul
          test -f workdir.tmp/files/Scene/UI/Title.szs
          test -d workdir.tmp/files/Race/Course
          ls workdir.tmp/files/Binaries/
          # NOTA: non usare MAI `wit --patch-wiimmfi` / dolpatch Wiimmfi qui:
          # il server online e' fornito da Pulsar/RetroWFC (rwfc.net), non da Wiimmfi.
          # `--security-fix` come negli script ufficiali (firma ticket/TMD).
          # UNICO contenitore .wbfs: lo leggono sia Dolphin sia i loader Wii.
          # Nome datato del giorno build (UTC).
          OUT="Mario Kart Wii(Retro Rewind)-Aggiornamento $(date -u +%d-%m-%Y).wbfs"
          echo "Nome output: $OUT"
          rm -rf new-image
          wit copy workdir.tmp -T0 --DEST new-image/%X -ovv --links \
            --id RMCPTO --ticket-id=RMCR --tmd-id=RMCR --boot-id=RMCP \
            --security-fix --name "Mario Kart Retro Rewind" --wbfs
          find new-image -maxdepth 1 -name '*.wbfs' -exec mv {} "new-image/$OUT" \;
          echo "OUTPUT_WBFS=$OUT" >> "$GITHUB_ENV"
          ls -lh new-image
          df -h .

      - name: Verifica file finale (RetroWFC, niente patch Wiimmfi)
        shell: bash
        run: |
          set -euxo pipefail
          WBFS="new-image/$OUTPUT_WBFS"
          test -f "$WBFS"
          # NOTA: `wit INFO` non legge le immagini. LIST/ID6/FILES si'.
          echo "=== $WBFS (Dolphin + Wii) ==="
          wit LIST -l "$WBFS" 2>&1 | tee /tmp/wit-info.txt
          grep -q "RMCPTO" /tmp/wit-info.txt || (echo "::error::GameID RMCPTO non trovato"; exit 1)
          grep -q "Mario Kart Retro Rewind" /tmp/wit-info.txt || (echo "::error::Nome atteso non trovato"; exit 1)
          wit ID6 "$WBFS" 2>&1 | grep -q "RMCPTO" || (echo "::error::ID RMCPTO non trovato nel WBFS"; exit 1)
          echo "--- Filelist (controllo Retro Rewind) ---"
          wit FILES "$WBFS" 2>&1 | tee /tmp/wit-files.txt | head -n 50
          # La build deve contenere i file Pulsar/Retro (almeno Binaries + Course).
          # `wit FILES` elenca i percorsi interni; accettiamo sia formati con
          # prefisso "/" sia senza.
          grep -q "Binaries/Code.pul\|files/Binaries/Code.pul\|/Binaries/" /tmp/wit-files.txt \
            || (echo "::warning::Code.pul non visibile in wit FILES, controllo con FILELIST"; wit FILELIST "$WBFS" 2>&1 | grep -q "Code.pul" || (echo "::error::Code.pul assente nella build finale"; exit 1))
          echo "OK: $OUTPUT_WBFS (Dolphin + Wii) con ID RMCPTO, loader EUR Kamek v2 e file Retro Rewind."
          echo "Server online: RetroWFC (rwfc.net) via Pulsar. Nessuna patch Wiimmfi applicata in questo workflow."
          {
            echo "## Verifica build"
            echo "- File unico: \`$OUTPUT_WBFS\` ($(du -h "$WBFS" | cut -f1)) per Dolphin E Wii (sulla USB in \`/wbfs/\`; se il forwarder cerca \`RMCPTO.wbfs\`, rinominalo cosi)"
            echo "- GameID: \`RMCPTO\` (base PAL RMCP01)"
            echo "- Loader: \`extra/Boot/Loaders/EUR/main.dol\` (Kamek v2) + dolpatch \`80005EFC\` verificato"
            echo "- Pulsar: \`Binaries/Code.pul\` + \`Loader.pul\` presenti"
            echo "- Server: RetroWFC (rwfc.net), nessuna patch Wiimmfi"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WBFS su Google Drive (link per WhatsApp)
        id: drive
        shell: bash
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          WBFS="new-image/$OUTPUT_WBFS"
          # 1. access token dal refresh token
          AT=$(curl -fsSL -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=$DRIVE_REFRESH_TOKEN" \
            --data-urlencode "client_id=$DRIVE_CLIENT_ID" \
            --data-urlencode "client_secret=$DRIVE_CLIENT_SECRET" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          # 2. upload del file in streaming (uploadType=media con --upload-file:
          # NON usare --data-binary multipart: caricherebbe i 3,3 GB in RAM)
          FID=$(curl -fsSL -X POST -T "$WBFS" \
            "https://www.googleapis.com/upload/drive/v3/files?uploadType=media&fields=id" \
            -H "Authorization: Bearer $AT" \
            -H "Content-Type: application/octet-stream" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "File caricato su Drive, ID: $FID"
          # 2b. imposta il nome file (uploadType=media non accetta metadati)
          META=$(python3 -c "import json; print(json.dumps({'name': '$OUTPUT_WBFS'}))")
          curl -fsSL -X PATCH "https://www.googleapis.com/drive/v3/files/$FID" \
            -H "Authorization: Bearer $AT" -H "Content-Type: application/json" \
            -d "$META" > /dev/null
          # 3. link pubblico (chiunque abbia il link puo' leggere)
          curl -fsSL -X POST "https://www.googleapis.com/drive/v3/files/$FID/permissions" \
            -H "Authorization: Bearer $AT" -H "Content-Type: application/json" \
            -d '{"type":"anyone","role":"reader"}' > /dev/null
          URL=$(curl -fsSL "https://www.googleapis.com/drive/v3/files/$FID?fields=webViewLink" \
            -H "Authorization: Bearer $AT" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['webViewLink'])")
          echo "Link Drive: $URL"
          echo "download_url=$URL" >> "$GITHUB_OUTPUT"
          # 4. pulizia: tengo solo i 2 file piu' recenti (quota Drive limitata)
          IDS=$(curl -fsSL "https://www.googleapis.com/drive/v3/files?pageSize=10&orderBy=createdTime%20desc&fields=files(id)" \
            -H "Authorization: Bearer $AT" \
            | python3 -c "
          import sys, json
          ids = [f['id'] for f in json.load(sys.stdin).get('files', [])]
          print(' '.join(ids[2:]))
          ")
          for OLD in $IDS; do
            [ "$OLD" = "$FID" ] && continue
            if curl -fsSL -X DELETE "https://www.googleapis.com/drive/v3/files/$OLD" \
              -H "Authorization: Bearer $AT" > /dev/null; then
              echo "Rimosso vecchio file da Drive: $OLD"
            fi
          done

      - name: Esponi nome WBFS per la notifica
        id: wbfsname
        shell: bash
        run: echo "wbfs_name=$OUTPUT_WBFS" >> "$GITHUB_OUTPUT"

      - name: Aggiorna stato e sincronizza il fork
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UP_SHA="${{ needs.check.outputs.upstream_sha }}"
          PACK_FP="${{ needs.check.outputs.pack_fp }}"
          BUILDER_FP="${{ needs.check.outputs.builder_fp }}"
          # Riallinea updatedbuilder.zip del repo al builder MEGA ufficiale
          # (quello su GitHub upstream e' obsoleto: Kamek v1).
          rm -rf /tmp/megabuilder-sync
          mkdir -p /tmp/megabuilder-sync
          mega-get "$BUILDER_MEGA_LINK" /tmp/megabuilder-sync >/dev/null 2>&1
          if ! cmp -s "/tmp/megabuilder-sync/$BUILDER_SUBDIR/$BUILDER_ZIP" updatedbuilder.zip; then
            cp "/tmp/megabuilder-sync/$BUILDER_SUBDIR/$BUILDER_ZIP" updatedbuilder.zip
            echo "updatedbuilder.zip aggiornato dal builder MEGA ufficiale"
          fi
          rm -rf /tmp/megabuilder-sync
          mkdir -p runtime
          printf '%s %s %s\n' "$UP_SHA" "$PACK_FP" "$BUILDER_FP" > runtime/state.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updatedbuilder.zip runtime/state.txt
          git diff --cached --quiet || git commit -m "sync: aggiorno builder MEGA e stato pack $PACK_FP"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"

      - name: Riepilogo
        if: always()
        shell: bash
        run: |
          {
            echo "## Retro Rewind build (RetroWFC) - Dolphin + Wii"
            echo "- Pack: v${{ needs.check.outputs.pack_version }}"
            echo "- Builder: MEGA ufficiale v6.12.5+ (Kamek v2, impronta \`${{ needs.check.outputs.builder_fp }}\`)"
            echo "- Upstream GitHub: \`${{ needs.check.outputs.upstream_sha }}\` (solo monitoraggio)"
            echo "- Regione: PAL (loader EUR, GameID RMCPTO)"
            echo "- File unico: \`${{ env.OUTPUT_WBFS }}\` (Drive: ${{ steps.drive.outputs.download_url }}) per Dolphin E Wii (sulla USB in \`/wbfs/\`; se il forwarder cerca \`RMCPTO.wbfs\`, rinominalo cosi)"
            echo "- Server: RetroWFC (rwfc.net), nessuna patch Wiimmfi"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-whatsapp:
    # Invio WhatsApp del .wbfs appena buildato via OpenWA, che gira
    # DIRETTAMENTE sul runner (niente VPS, niente Baileys diretto):
    # il server parte in locale, la sessione viene ripristinata dal secret
    # OPENWA_BAILEYS_CREDS_B64 e l'invio avviene via API REST su 127.0.0.1.
    # Gira solo se la build e' andata a buon fine (o in modalita test_whatsapp).
    # Secrets richiesti: OPENWA_API_KEY, OPENWA_BAILEYS_CREDS_B64 (creds.json
    # Baileys in base64), WA_GROUP_ID (gia' esistente).
    # NESSUNA credenziale nel repo.
    needs: [check, build]
    if: always() && (needs.build.result == 'success' || github.event.inputs.test_whatsapp == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: openwa-notify
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache npm (dipendenze OpenWA)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-openwa-v1

      - name: Clona e compila OpenWA
        run: |
          set -euxo pipefail
          rm -rf openwa
          git clone --depth 1 https://github.com/rmyndharis/OpenWA openwa
          cd openwa
          # Niente Chromium: usiamo solo il motore Baileys
          export PUPPETEER_SKIP_DOWNLOAD=1
          npm ci --no-audit --no-fund --loglevel=error
          npm run build

      - name: Avvia OpenWA e invia notifica
        env:
          OPENWA_API_KEY: ${{ secrets.OPENWA_API_KEY }}
          OPENWA_BAILEYS_CREDS_B64: ${{ secrets.OPENWA_BAILEYS_CREDS_B64 }}
          WA_GROUP_ID: ${{ secrets.WA_GROUP_ID }}
          PACK_VERSION: ${{ needs.check.outputs.pack_version }}
          DRIVE_URL: ${{ needs.build.outputs.download_url }}
          WBFS_NAME: ${{ needs.build.outputs.wbfs_name }}
          WA_TEST_MODE: ${{ github.event.inputs.test_whatsapp }}
        run: |
          set -euo pipefail
          cd openwa
          mkdir -p data
          printf 'ENGINE_TYPE=baileys\nPORT=2785\n' > .env
          # La chiave API va passata via API_MASTER_KEY al primo avvio
          # (data/.api-key viene scritto dal server, non letto)
          API_MASTER_KEY="$OPENWA_API_KEY" node dist/main.js > ../openwa-server.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          API="http://127.0.0.1:2785"
          # 1. attesa avvio server con motore baileys
          for i in $(seq 1 24); do
            if curl -sf -m 5 -H "x-api-key: $OPENWA_API_KEY" \
                "$API/api/infra/engines/current" 2>/dev/null | grep -q baileys; then
              echo "OpenWA avviato (motore baileys)"
              break
            fi
            sleep 5
            if [ "$i" = 24 ]; then
              echo "::error::OpenWA non partito in tempo"
              tail -n 30 ../openwa-server.log || true
              exit 1
            fi
          done
          # 2. crea sessione e ripristina le credenziali Baileys dal secret
          SID=$(curl -sf -m 15 -X POST -H "x-api-key: $OPENWA_API_KEY" \
            -H 'Content-Type: application/json' -d '{"name":"retro-rewind"}' \
            "$API/api/sessions" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "sessione: $SID"
          mkdir -p "data/baileys/$SID"
          printf '%s' "$OPENWA_BAILEYS_CREDS_B64" | base64 -d > "data/baileys/$SID/creds.json"
          chmod 600 "data/baileys/$SID/creds.json"
          curl -sf -m 15 -X POST -H "x-api-key: $OPENWA_API_KEY" \
            "$API/api/sessions/$SID/start" > /dev/null
          # 3. attesa connessione a WhatsApp
          for i in $(seq 1 36); do
            ST=$(curl -s -m 10 -H "x-api-key: $OPENWA_API_KEY" \
              "$API/api/sessions/$SID" 2>/dev/null \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','?'))" 2>/dev/null || echo "?")
            echo "stato sessione: $ST"
            [ "$ST" = ready ] && break
            if [ "$ST" = qr_ready ] || [ "$ST" = failed ]; then
              echo "::error::sessione WhatsApp non ripristinata (stato $ST): rigenerare il secret OPENWA_BAILEYS_CREDS_B64"
              exit 1
            fi
            sleep 5
            if [ "$i" = 36 ]; then
              echo "::error::timeout connessione WhatsApp"
              exit 1
            fi
          done
          # 4. invio messaggio al gruppo
          if [ "${WA_TEST_MODE:-false}" = "true" ]; then
            MSG="Test notifica Retro Rewind: OpenWA gira su GitHub Actions e funziona"
          else
            MSG="Retro Rewind aggiornata! Nuova build pronta: ${WBFS_NAME:-file .wbfs} (pack v$PACK_VERSION)"
            if [ -n "${DRIVE_URL:-}" ]; then
              MSG=$(printf '%s\nDownload: %s' "$MSG" "$DRIVE_URL")
            fi
          fi
          BODY=$(python3 -c "import json,sys; print(json.dumps({'chatId': sys.argv[1], 'text': sys.argv[2]}))" \
            "$WA_GROUP_ID" "$MSG")
          RESP=$(curl -sf -m 30 -X POST -H "x-api-key: $OPENWA_API_KEY" \
            -H 'Content-Type: application/json' -d "$BODY" \
            "$API/api/sessions/$SID/messages/send-text")
          echo "inviato: $RESP"
