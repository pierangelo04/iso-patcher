name: Build & upload Retro Rewind ISO

# Workflow automatizzato per ISO Retro Rewind (RetroWFC, NON Wiimmfi).
# Procedura manuale di riferimento (video https://www.youtube.com/watch?v=z5PW9iPkZfQ):
#  1. scarica Retro Rewind full da wiki (rwfc.net) -> RetroRewind6/
#  2. scarica ISO builder "Wiimm Edition for v6.12.5 and above" dal link MEGA
#     nella sidebar wiki (https://mkwiiki.org/wiki/Retro_Rewind)
#  3. installa Wiimm ISO Tools (wit)
#  4. metti Mario Kart Wii .iso/.wbfs nella stessa cartella
#  5. lancia create-rr-pal.bat (PAL) / -usa / -jpn in base alla regione Wii
#  6. prendi il file da new-image/ e trasferiscilo su USB con Wii Backup Manager
#  7. installa il forwarder WAD di Kote3767 e avvia da System Menu (non da HBC)
# Questo workflow replica gli stessi passi su ubuntu-latest per la regione PAL.
#
# FIX 1 - RetroWFC vs Wiimmfi (verificato sui log run 34715396539):
#  il log mostrava `cp: cannot stat './extra/Boot/Loaders/PAL/main.dol'`.
#  Il vecchio copy-files.sh di GitHub usava $SRC_TYPE per scegliere il loader,
#  ma le cartelle sono EUR/USA/JPN (non PAL). Senza loader EUR, l'ISO teneva
#  il main.dol vanilla -> Pulsar/RetroWFC non partiva e l'USB Loader ripiegava
#  sulla patch di default Wiimmfi. MAI usare `wit --patch-wiimmfi`.
#
# FIX 2 - "FATAL ERROR: Incompatible file (version 2), please upgrade your
#  Kamek Loader" su Dolphin (e Wii): il builder su GitHub
#  (Retro-Rewind-Team/iso-patcher -> updatedbuilder.zip, 05/2026) contiene un
#  main.dol con Kamek Loader vecchio, incompatibile con i .pul v2 del pack
#  corrente. La wiki ufficiale dice di usare l'archivio
#  "Retro Rewind ISO Builder Wiimm Edition for v6.12.5 and above.zip" dal link
#  MEGA (https://mega.nz/folder/yW40yJqI#l9RG4RsVWRSwoAVyXpqr4w), che contiene
#  main.dol aggiornati (09/2026), SRC_TYPE=EUR per PAL, riga dolpatch
#  `80005EFC=0000000A` e flag `--security-fix`.
#  PERCIO' QUESTO WORKFLOW SCARICA IL BUILDER DA MEGA, NON DA GITHUB.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forza la ricompilazione anche senza aggiornamenti"
        type: boolean
        required: false
        default: false
      region:
        description: "Regione da buildare"
        type: choice
        required: false
        default: "PAL"
        options:
          - PAL
          - USA
          - JPN
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-retro-rewind.yml"

permissions:
  contents: write

env:
  UPSTREAM_REPO: Retro-Rewind-Team/iso-patcher
  PACK_ZIP_URL: https://update.rwfc.net/RetroRewind/zip/RetroRewind.zip
  PACK_VERSION_URL: https://update.rwfc.net/RetroRewind/RetroRewindVersion.txt
  # ISO builder UFFICIALE aggiornato (Kamek Loader v2, fix PAL->EUR):
  # cartella MEGA pubblica linkata dalla wiki. Lo zip contiene
  # "Retro Rewind ISO Builder/Retro Rewind ISO Builder Wiimm Edition for v6.12.5 and above.zip".
  BUILDER_MEGA_LINK: https://mega.nz/folder/yW40yJqI#l9RG4RsVWRSwoAVyXpqr4w
  BUILDER_ZIP: Retro Rewind ISO Builder Wiimm Edition for v6.12.5 and above.zip
  BUILDER_SUBDIR: Retro Rewind ISO Builder
  # md5 del main.dol EUR VECCHIO (GitHub 05/2026, Kamek v1): se il builder
  # scaricato lo contiene ancora, la build deve fallire invece di produrre
  # una ISO con "Incompatible file (version 2)".
  OLD_LOADER_MD5_EUR: 5f8e596c3b500aaa267888f4c9ae3cd8
  # Base ISO PAL (deve contenere RMCP01). NON piu' da archive.org:
  # la ISO originale va caricata su MEGA nella cartella /iso-originale/
  # (es. /iso-originale/MarioKart.iso). Se MEGA_ISO_NAME e' vuoto,
  # il workflow prende automaticamente il primo .iso trovato nella cartella.
  MEGA_ISO_DIR: /iso-originale
  MEGA_ISO_NAME: ""
  WIT_URL: https://wit.wiimm.de/download/wit-v3.05a-r8638-x86_64.tar.gz
  STATE_FILE: runtime/state.txt
  # Due output dalla STESSA workdir patchata (stesso contenuto, due contenitori):
  #  - .iso  -> Dolphin (PC/Mac/Android/iOS)
  #  - .wbfs -> Wii / Wii U (vWii) via USB Loader GX / WiiFlow.
  #    Nome file = GameID esatto: i forwarder di Kote e i loader cercano RMCPTO
  #    (percorso consigliato sulla USB: /wbfs/RMCPTO.wbfs).
  OUTPUT_NAME: MarioKart-RetroRewind-PAL.iso
  OUTPUT_WBFS: RMCPTO.wbfs

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      rebuild: ${{ steps.check.outputs.rebuild }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      pack_fp: ${{ steps.check.outputs.pack_fp }}
      pack_version: ${{ steps.check.outputs.pack_version }}
      builder_fp: ${{ steps.check.outputs.builder_fp }}
      region: ${{ steps.check.outputs.region }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installa MEGAcmd (per fingerprint builder)
        shell: bash
        run: |
          if ! command -v mega-ls >/dev/null 2>&1; then
            source /etc/os-release
            DEB="megacmd-xUbuntu_${VERSION_ID}_amd64.deb"
            wget -q "https://mega.nz/linux/repo/xUbuntu_${VERSION_ID}/amd64/${DEB}" -O "/tmp/${DEB}"
            sudo apt install -y "/tmp/${DEB}"
          fi
          mega-ls --version 2>&1 | head -n2 || true

      - name: Rileva aggiornamenti (patcher / pack / builder)
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MEGA_USERNAME: ${{ secrets.MEGA_USERNAME }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -uo pipefail
          UP_SHA=$(gh api "repos/$UPSTREAM_REPO/commits/main" --jq .sha 2>/dev/null \
                   || curl -fsSL "https://api.github.com/repos/$UPSTREAM_REPO/commits/main" 2>/dev/null | jq -r .sha 2>/dev/null \
                   || true)
          PACK_FP=$(curl -fsSL "$PACK_VERSION_URL" 2>/dev/null | tr -d ' \t\r' | sort | sha256sum | awk '{print $1}')
          VER=$(curl -fsSL "$PACK_VERSION_URL" 2>/dev/null | sed '/^$/d' | tail -n1 | awk '{print $1}')
          # Fingerprint del builder MEGA (listing nomi+date+dimesioni): se Kote
          # aggiorna l'ISO Builder, la build riparte. Se il listing fallisce
          # (es. secret mancanti), riusa il valore salvato -> neutro, nessun rebuild.
          STORED_BUILDER_FP=$(awk '{print $3}' "$STATE_FILE" 2>/dev/null || true)
          BUILDER_FP="${STORED_BUILDER_FP:-no-mega}"
          if [ -n "${MEGA_USERNAME:-}" ] && [ -n "${MEGA_PASSWORD:-}" ]; then
            mega-login "$MEGA_USERNAME" "$MEGA_PASSWORD" >/dev/null 2>&1 || true
            if MEGA_LS=$(mega-ls -l "$BUILDER_MEGA_LINK" 2>/dev/null) && [ -n "$MEGA_LS" ]; then
              BUILDER_FP=$(printf '%s' "$MEGA_LS" | sha256sum | awk '{print $1}')
            fi
            mega-logout >/dev/null 2>&1 || true
          fi
          LAST=$(cat "$STATE_FILE" 2>/dev/null || true)
          FORCE="${{ github.event.inputs.force }}"
          REGION_IN="${{ github.event.inputs.region }}"
          REGION="${REGION_IN:-PAL}"
          PACK_FP=${PACK_FP:-no-ver}
          VER=${VER:-unknown}

          echo "upstream_sha=$UP_SHA" >> "$GITHUB_OUTPUT"
          echo "pack_fp=$PACK_FP" >> "$GITHUB_OUTPUT"
          echo "pack_version=$VER" >> "$GITHUB_OUTPUT"
          echo "builder_fp=$BUILDER_FP" >> "$GITHUB_OUTPUT"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"

          if [ -z "$UP_SHA" ]; then
            echo "Impossibile contattare l'API di GitHub, controllo saltato." >> "$GITHUB_STEP_SUMMARY"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Nota: al momento la build automatica supporta solo PAL (la ISO su MEGA
          # in /iso-originale deve contenere RMCP01). Se viene richiesta USA/JPN,
          # falliamo presto con messaggio chiaro.
          if [ "$REGION" != "PAL" ]; then
            echo "## Regione non supportata in automatico" >> "$GITHUB_STEP_SUMMARY"
            echo "Richesta regione \`$REGION\`, ma la ISO su MEGA e' PAL (RMCP01)." >> "$GITHUB_STEP_SUMMARY"
            echo "Usa PAL oppure carica in /iso-originale una ISO RMCE01/RMCJ01." >> "$GITHUB_STEP_SUMMARY"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$FORCE" = "true" ] || [ -z "$LAST" ] || [ "$LAST" != "$UP_SHA $PACK_FP $BUILDER_FP" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Rilevato un aggiornamento, ricompilo"
              echo "- Patcher GitHub: \`$UP_SHA\`"
              echo "- Pack Retro Rewind v$VER (impronta \`${PACK_FP:0:8}\`)"
              echo "- Builder MEGA (impronta \`${BUILDER_FP:0:8}\`)"
              echo "- Regione: \`$REGION\` (RetroWFC, non Wiimmfi)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "Nessun aggiornamento per patcher, pack o builder, build saltata." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: check
    if: needs.check.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Installa wit (Wiimms ISO Tools)
        run: |
          curl -fsSL -o /tmp/wit.tar.gz "$WIT_URL"
          tar xzf /tmp/wit.tar.gz -C /tmp
          WITDIR=$(ls -d /tmp/wit-v3.05a* | head -n1)
          sudo install -m755 "$WITDIR/bin/wit" /usr/local/bin/wit
          wit --version

      - name: Installa MEGAcmd
        shell: bash
        run: |
          if ! command -v mega-get >/dev/null 2>&1; then
            source /etc/os-release
            DEB="megacmd-xUbuntu_${VERSION_ID}_amd64.deb"
            wget -q "https://mega.nz/linux/repo/xUbuntu_${VERSION_ID}/amd64/${DEB}" -O "/tmp/${DEB}"
            sudo apt install -y "/tmp/${DEB}"
          fi
          mega-get --version 2>&1 | head -n2 || true

      - name: Prepara il patcher (ISO Builder v6.12.5+ da MEGA)
        shell: bash
        run: |
          set -euxo pipefail
          # Link pubblico (anonimo, nessun login): contiene SEMPRE il builder
          # aggiornato con Kamek Loader v2. Quello su GitHub e' obsoleto (v1).
          rm -rf /tmp/megabuilder
          mega-get "$BUILDER_MEGA_LINK" /tmp/megabuilder
          ls -R /tmp/megabuilder | head -n 30
          unzip -q -o "/tmp/megabuilder/$BUILDER_SUBDIR/$BUILDER_ZIP"
          chmod a+x *.sh
          ls -R extra/Boot/Loaders
          test -f extra/Boot/Loaders/EUR/main.dol
          test -f copy-files.sh
          grep -q "80005EFC" copy-files.sh || (echo "::error::copy-files.sh senza riga dolpatch 80005EFC: builder obsoleto?"; exit 1)
          # Guardia Kamek v2: rifiuta il vecchio main.dol GitHub (Kamek v1),
          # che produrrebbe "Incompatible file (version 2)" su Dolphin/Wii.
          GOT_MD5=$(md5sum extra/Boot/Loaders/EUR/main.dol | awk '{print $1}')
          echo "main.dol EUR md5=$GOT_MD5"
          if [ "$GOT_MD5" = "$OLD_LOADER_MD5_EUR" ]; then
            echo "::error::main.dol EUR ancora quello vecchio (Kamek v1). Builder MEGA non aggiornato?"
            exit 1
          fi
          rm -rf /tmp/megabuilder

      - name: Scarica il pack Retro Rewind (full, RetroWFC)
        run: |
          curl -fL --retry 5 --retry-all-errors -C - -A "Mozilla/5.0" -o RetroRewind.zip "$PACK_ZIP_URL"
          unzip -q RetroRewind.zip 'RetroRewind6/*'
          rm -f RetroRewind.zip
          du -sh RetroRewind6
          test -f RetroRewind6/UI/Title.szs
          test -f RetroRewind6/Binaries/Code.pul
          test -f RetroRewind6/Binaries/Loader.pul
          echo "Pack OK: Code.pul + Loader.pul presenti (Pulsar/RetroWFC)"

      - name: Scarica ISO base da MEGA (PAL, RMCP01)
        shell: bash
        env:
          MEGA_USERNAME: ${{ secrets.MEGA_USERNAME }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -euxo pipefail
          if [ -z "${MEGA_USERNAME:-}" ] || [ -z "${MEGA_PASSWORD:-}" ]; then
            echo "::error::Secrets MEGA_USERNAME/MEGA_PASSWORD mancanti. Impostali in Settings > Secrets."
            exit 1
          fi
          # MEGAcmd gia' installato nello step dedicato; qui serve solo il login
          # per la cartella privata /iso-originale (il builder sopra e' pubblico).
          mega-login "$MEGA_USERNAME" "$MEGA_PASSWORD"
          echo "--- Contenuto di $MEGA_ISO_DIR ---"
          mega-ls -l "$MEGA_ISO_DIR"
          # Nome file: da MEGA_ISO_NAME oppure primo .iso trovato nella cartella
          if [ -n "${MEGA_ISO_NAME:-}" ]; then
            REMOTE_FILE="$MEGA_ISO_DIR/$MEGA_ISO_NAME"
          else
            PICK=$(mega-ls "$MEGA_ISO_DIR" | grep -i '\.iso$' | head -n1 | tr -d '\r' | xargs || true)
            if [ -n "$PICK" ]; then PICK=$(basename "$PICK"); fi
            if [ -z "$PICK" ]; then
              echo "::error::Nessun file .iso trovato in $MEGA_ISO_DIR su MEGA."
              exit 1
            fi
            REMOTE_FILE="$MEGA_ISO_DIR/$PICK"
          fi
          echo "Scarico $REMOTE_FILE -> MarioKart.iso"
          mega-get "$REMOTE_FILE" ./MarioKart.iso
          mega-logout || true
          ls -lh MarioKart.iso
          # NOTA: `wit INFO` stampa keywords interne, NON le ISO. Per le ISO usare LIST/ID6.
          wit LIST MarioKart.iso 2>&1 | head -n 30
          wit ID6 MarioKart.iso 2>&1 | grep -q "RMCP01" || (echo "::error::La ISO base da MEGA non contiene RMCP01 (PAL). Controlla il file in $MEGA_ISO_DIR."; exit 1)

      - name: Compila l'ISO patchata (PAL -> loader EUR, RetroWFC)
        shell: bash
        run: |
          set -euxo pipefail
          df -h .
          rm -rf workdir.tmp new-image
          wit extract MarioKart.iso --DEST workdir.tmp --psel data --links --include RMCP01 -vv1 -F-.svn/
          test -d workdir.tmp
          test -f workdir.tmp/setup.txt
          rm -f MarioKart.iso
          # --- FIX RetroWFC: PAL usa il loader EUR (come create-rr-pal.bat BASEVER=EUR).
          # copy-files.sh con SRC_TYPE=PAL cercherebbe extra/Boot/Loaders/PAL/main.dol
          # che NON esiste -> main.dol vanilla -> online su Wiimmfi invece di RetroWFC.
          # Usiamo quindi SRC_TYPE=EUR e verifichiamo con cmp.
          ls -lh "extra/Boot/Loaders/EUR/main.dol"
          SRC_TYPE=EUR ./copy-files.sh
          echo "--- Verifica loader Retro (deve essere identico a extra/Boot/Loaders/EUR/main.dol) ---"
          ls -lh workdir.tmp/sys/main.dol extra/Boot/Loaders/EUR/main.dol extra/thp/bi2.bin workdir.tmp/sys/bi2.bin
          cmp workdir.tmp/sys/main.dol extra/Boot/Loaders/EUR/main.dol || (echo "::error::main.dol NON sostituito: l'ISO avvierebbe vanilla/Wiimmfi invece di RetroWFC"; exit 1)
          cmp workdir.tmp/sys/bi2.bin extra/thp/bi2.bin || (echo "::error::bi2.bin NON sostituito"; exit 1)
          echo "--- Verifica file Retro Rewind in workdir ---"
          test -f workdir.tmp/files/Binaries/Code.pul
          test -f workdir.tmp/files/Binaries/Loader.pul
          test -f workdir.tmp/files/Scene/UI/Title.szs
          test -d workdir.tmp/files/Race/Course
          ls workdir.tmp/files/Binaries/
          # NOTA: non usare MAI `wit --patch-wiimmfi` / dolpatch Wiimmfi qui:
          # il server online e' fornito da Pulsar/RetroWFC (rwfc.net), non da Wiimmfi.
          # `--security-fix` come negli script ufficiali (firma ticket/TMD).
          # Si generano ENTRAMBI i contenitori dalla stessa workdir:
          #  .iso  = Dolphin,  .wbfs = Wii (USB Loader GX / WiiFlow).
          rm -rf new-image
          wit copy workdir.tmp -T0 --DEST new-image/%X -ovv --links \
            --id RMCPTO --ticket-id=RMCR --tmd-id=RMCR --boot-id=RMCP \
            --security-fix --name "Mario Kart Retro Rewind" --iso
          find new-image -maxdepth 1 -name '*.iso' -exec mv {} "new-image/$OUTPUT_NAME" \;
          wit copy workdir.tmp -T0 --DEST new-image/%X -ovv --links \
            --id RMCPTO --ticket-id=RMCR --tmd-id=RMCR --boot-id=RMCP \
            --security-fix --name "Mario Kart Retro Rewind" --wbfs
          find new-image -maxdepth 1 -name '*.wbfs' -exec mv {} "new-image/$OUTPUT_WBFS" \;
          ls -lh new-image
          df -h .

      - name: Verifica file finali (RetroWFC, niente patch Wiimmfi)
        shell: bash
        run: |
          set -euxo pipefail
          ISO="new-image/$OUTPUT_NAME"
          WBFS="new-image/$OUTPUT_WBFS"
          test -f "$ISO"
          test -f "$WBFS"
          # NOTA: `wit INFO` non legge le ISO. LIST/ID6 si'.
          for F in "$ISO" "$WBFS"; do
            echo "=== $F ==="
            wit LIST -l "$F" 2>&1 | tee "/tmp/wit-info-$(basename "$F").txt"
            grep -q "RMCPTO" "/tmp/wit-info-$(basename "$F").txt" || (echo "::error::GameID RMCPTO non trovato in $F"; exit 1)
          done
          grep -q "Mario Kart Retro Rewind" "/tmp/wit-info-$OUTPUT_NAME.txt" || (echo "::error::Nome ISO atteso non trovato"; exit 1)
          echo "--- Filelist (controllo Retro Rewind) ---"
          wit FILES "$ISO" 2>&1 | tee /tmp/wit-files.txt | head -n 50
          # La build deve contenere i file Pulsar/Retro (almeno Binaries + Course).
          # `wit FILES` elenca i percorsi interni; accettiamo sia formati con
          # prefisso "/" sia senza.
          grep -q "Binaries/Code.pul\|files/Binaries/Code.pul\|/Binaries/" /tmp/wit-files.txt \
            || (echo "::warning::Code.pul non visibile in wit FILES, controllo con FILELIST"; wit FILELIST "$ISO" 2>&1 | grep -q "Code.pul" || (echo "::error::Code.pul assente nella build finale"; exit 1))
          # Stesso contenuto atteso nel .wbfs per la Wii
          wit ID6 "$WBFS" 2>&1 | grep -q "RMCPTO" || (echo "::error::ID RMCPTO non trovato nel WBFS"; exit 1)
          echo "OK: $OUTPUT_NAME (Dolphin) + $OUTPUT_WBFS (Wii) con ID RMCPTO, loader EUR e file Retro Rewind."
          echo "Server online: RetroWFC (rwfc.net) via Pulsar. Nessuna patch Wiimmfi applicata in questo workflow."
          {
            echo "## Verifica build"
            echo "- Dolphin: \`$OUTPUT_NAME\` ($(du -h "$ISO" | cut -f1))"
            echo "- Wii: \`$OUTPUT_WBFS\` ($(du -h "$WBFS" | cut -f1)) -> copiare in \`/wbfs/$OUTPUT_WBFS\` sulla USB"
            echo "- GameID: \`RMCPTO\` (base PAL RMCP01)"
            echo "- Loader: \`extra/Boot/Loaders/EUR/main.dol\` (Kamek v2) verificato con \`cmp\`"
            echo "- Pulsar: \`Binaries/Code.pul\` + \`Loader.pul\` presenti"
            echo "- Server: RetroWFC (rwfc.net), nessuna patch Wiimmfi"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact ISO (Dolphin)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: new-image/${{ env.OUTPUT_NAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload artifact WBFS (Wii)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_WBFS }}
          path: new-image/${{ env.OUTPUT_WBFS }}
          if-no-files-found: error
          retention-days: 7

      - name: Verifica credenziali MEGA
        id: mega
        shell: bash
        env:
          MEGA_USERNAME: ${{ secrets.MEGA_USERNAME }}
        run: |
          if [ -n "$MEGA_USERNAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload ISO su MEGA (Dolphin)
        if: steps.mega.outputs.enabled == 'true'
        uses: Difegue/action-megacmd@1.4.0
        env:
          USERNAME: ${{ secrets.MEGA_USERNAME }}
          PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        with:
          args: put -c /github/workspace/new-image/${{ env.OUTPUT_NAME }} /RetroRewind/

      - name: Upload WBFS su MEGA (Wii)
        if: steps.mega.outputs.enabled == 'true'
        uses: Difegue/action-megacmd@1.4.0
        env:
          USERNAME: ${{ secrets.MEGA_USERNAME }}
          PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        with:
          args: put -c /github/workspace/new-image/${{ env.OUTPUT_WBFS }} /RetroRewind/

      - name: Aggiorna stato e sincronizza il fork
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UP_SHA="${{ needs.check.outputs.upstream_sha }}"
          PACK_FP="${{ needs.check.outputs.pack_fp }}"
          BUILDER_FP="${{ needs.check.outputs.builder_fp }}"
          # Riallinea updatedbuilder.zip del repo al builder MEGA ufficiale
          # (quello su GitHub upstream e' obsoleto: Kamek v1).
          rm -rf /tmp/megabuilder-sync
          mega-get "$BUILDER_MEGA_LINK" /tmp/megabuilder-sync >/dev/null 2>&1
          if ! cmp -s "/tmp/megabuilder-sync/$BUILDER_SUBDIR/$BUILDER_ZIP" updatedbuilder.zip; then
            cp "/tmp/megabuilder-sync/$BUILDER_SUBDIR/$BUILDER_ZIP" updatedbuilder.zip
            echo "updatedbuilder.zip aggiornato dal builder MEGA ufficiale"
          fi
          rm -rf /tmp/megabuilder-sync
          mkdir -p runtime
          printf '%s %s %s\n' "$UP_SHA" "$PACK_FP" "$BUILDER_FP" > runtime/state.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updatedbuilder.zip runtime/state.txt
          git diff --cached --quiet || git commit -m "sync: aggiorno builder MEGA e stato pack $PACK_FP"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"

      - name: Riepilogo
        if: always()
        shell: bash
        run: |
          {
            echo "## Retro Rewind build (RetroWFC) - Dolphin + Wii"
            echo "- Pack: v${{ needs.check.outputs.pack_version }}"
            echo "- Builder: MEGA ufficiale v6.12.5+ (Kamek v2, impronta \`${{ needs.check.outputs.builder_fp }}\`)"
            echo "- Upstream GitHub: \`${{ needs.check.outputs.upstream_sha }}\` (solo monitoraggio)"
            echo "- Regione: PAL (loader EUR, GameID RMCPTO)"
            echo "- Dolphin: \`${{ env.OUTPUT_NAME }}\` (artifact + \`/RetroRewind/${{ env.OUTPUT_NAME }}\` su MEGA)"
