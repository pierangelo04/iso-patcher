name: Build & upload Retro Rewind ISO

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forza la ricompilazione anche senza aggiornamenti"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-retro-rewind.yml"

permissions:
  contents: write

env:
  UPSTREAM_REPO: Retro-Rewind-Team/iso-patcher
  PACK_ZIP_URL: https://update.rwfc.net/RetroRewind/zip/RetroRewind.zip
  PACK_VERSION_URL: https://update.rwfc.net/RetroRewind/RetroRewindVersion.txt
  ISO_URL: https://archive.org/download/mario-kart_202107/MarioKart.iso
  WIT_URL: https://wit.wiimm.de/download/wit-v3.05a-r8638-x86_64.tar.gz
  STATE_FILE: runtime/state.txt
  OUTPUT_NAME: MarioKart-RetroRewind-PAL.iso

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      rebuild: ${{ steps.check.outputs.rebuild }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      pack_fp: ${{ steps.check.outputs.pack_fp }}
      pack_version: ${{ steps.check.outputs.pack_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rileva aggiornamenti (patcher / pack)
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          UP_SHA=$(gh api "repos/$UPSTREAM_REPO/commits/main" --jq .sha 2>/dev/null \
                   || curl -fsSL "https://api.github.com/repos/$UPSTREAM_REPO/commits/main" 2>/dev/null | jq -r .sha 2>/dev/null \
                   || true)
          PACK_FP=$(curl -fsSL "$PACK_VERSION_URL" 2>/dev/null | tr -d ' \t\r' | sort | sha256sum | awk '{print $1}')
          VER=$(curl -fsSL "$PACK_VERSION_URL" 2>/dev/null | sed '/^$/d' | tail -n1 | awk '{print $1}')
          LAST=$(cat "$STATE_FILE" 2>/dev/null || true)
          FORCE="${{ github.event.inputs.force }}"
          PACK_FP=${PACK_FP:-no-ver}
          VER=${VER:-unknown}

          echo "upstream_sha=$UP_SHA" >> "$GITHUB_OUTPUT"
          echo "pack_fp=$PACK_FP" >> "$GITHUB_OUTPUT"
          echo "pack_version=$VER" >> "$GITHUB_OUTPUT"

          if [ -z "$UP_SHA" ]; then
            echo "Impossibile contattare l'API di GitHub, controllo saltato." >> "$GITHUB_STEP_SUMMARY"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$FORCE" = "true" ] || [ -z "$LAST" ] || [ "$LAST" != "$UP_SHA $PACK_FP" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Rilevato un aggiornamento, ricompilo"
              echo "- Patcher: \`$UP_SHA\`"
              echo "- Pack Retro Rewind v$VER (impronta \`${PACK_FP:0:8}\`)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "Nessun aggiornamento per patcher o pack, build saltata." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: check
    if: needs.check.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Installa wit (Wiimms ISO Tools)
        run: |
          curl -fsSL -o /tmp/wit.tar.gz "$WIT_URL"
          tar xzf /tmp/wit.tar.gz -C /tmp
          WITDIR=$(ls -d /tmp/wit-v3.05a* | head -n1)
          sudo install -m755 "$WITDIR/bin/wit" /usr/local/bin/wit
          wit --version

      - name: Prepara il patcher (updatedbuilder)
        run: |
          curl -fsSL -o /tmp/updatedbuilder.zip "https://raw.githubusercontent.com/$UPSTREAM_REPO/main/updatedbuilder.zip"
          unzip -q -o /tmp/updatedbuilder.zip
          chmod a+x *.sh

      - name: Scarica il pack Retro Rewind (full)
        run: |
          curl -fL --retry 5 --retry-all-errors -C - -A "Mozilla/5.0" -o RetroRewind.zip "$PACK_ZIP_URL"
          unzip -q RetroRewind.zip 'RetroRewind6/*'
          rm -f RetroRewind.zip
          du -sh RetroRewind6

      - name: Scarica MarioKart.iso (PAL)
        run: |
          curl -fL --retry 5 --retry-all-errors -C - -A "Mozilla/5.0" -o MarioKart.iso "$ISO_URL"
          ls -la MarioKart.iso

      - name: Compila l'ISO patchata (PAL)
        shell: bash
        run: |
          set -euxo pipefail
          df -h .
          # equivalente di create-rr-pal.sh (src RMCP01 -> dest RMCPTO, formato ISO)
          rm -rf workdir.tmp
          wit extract MarioKart.iso --DEST workdir.tmp --psel data --links --include RMCP01 -vv1 -F-.svn/
          test -d workdir.tmp
          rm -f MarioKart.iso
          ./copy-files.sh
          rm -rf new-image
          wit copy workdir.tmp -T0 --DEST new-image/%X -ovv --links \
            --id RMCPTO --ticket-id=RMCR --tmd-id=RMCR --boot-id=RMCP \
            --name "Mario Kart Retro Rewind" --iso
          find new-image -maxdepth 1 -name '*.iso' -exec mv {} "new-image/$OUTPUT_NAME" \;
          ls -la new-image
          df -h .

      - name: Verifica credenziali MEGA
        id: mega
        shell: bash
        env:
          MEGA_USERNAME: ${{ secrets.MEGA_USERNAME }}
        run: |
          if [ -n "$MEGA_USERNAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload su MEGA - rimuovi vecchia versione (se esiste)
        if: steps.mega.outputs.enabled == 'true'
        continue-on-error: true
        uses: Difegue/action-megacmd@1.4.0
        env:
          USERNAME: ${{ secrets.MEGA_USERNAME }}
          PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        with:
          args: rm -f /RetroRewind/${{ env.OUTPUT_NAME }}

      - name: Upload su MEGA - ISO
        if: steps.mega.outputs.enabled == 'true'
        uses: Difegue/action-megacmd@1.4.0
        env:
          USERNAME: ${{ secrets.MEGA_USERNAME }}
          PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        with:
          args: put -c /github/workspace/new-image/${{ env.OUTPUT_NAME }} /RetroRewind/

      - name: Aggiorna stato e sincronizza il fork
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UP_SHA="${{ needs.check.outputs.upstream_sha }}"
          PACK_FP="${{ needs.check.outputs.pack_fp }}"
          curl -fsSL -o /tmp/updatedbuilder.new.zip "https://raw.githubusercontent.com/$UPSTREAM_REPO/main/updatedbuilder.zip"
          if ! cmp -s /tmp/updatedbuilder.new.zip updatedbuilder.zip; then
            cp /tmp/updatedbuilder.new.zip updatedbuilder.zip
            echo "updatedbuilder.zip aggiornato dal repo upstream"
          fi
          mkdir -p runtime
          printf '%s %s\n' "$UP_SHA" "$PACK_FP" > runtime/state.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updatedbuilder.zip runtime/state.txt
          git diff --cached --quiet || git commit -m "sync: ageggio iso-patcher e stato pack $PACK_FP"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"

      - name: Riepilogo
        if: always()
        shell: bash
        run: |
          {
            echo "## Retro Rewind ISO build"
            echo "- Pack: v${{ needs.check.outputs.pack_version }}"
            echo "- Upstream iso-patcher: \`${{ needs.check.outputs.upstream_sha }}\`"
            echo "- File caricato su MEGA: \`/RetroRewind/${{ env.OUTPUT_NAME }}\`"
          } >> "$GITHUB_STEP_SUMMARY"