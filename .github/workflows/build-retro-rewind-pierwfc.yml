name: Build Retro Rewind ISO (PierWFC server)

# Seconda versione della ISO Retro Rewind che si collega al server WFC
# personale (PierWFC, sul VPS) invece che a RetroWFC ufficiale.
# Workflow SEPARATO da build-retro-rewind.yml: non lo sostituisce e non fa
# commit. Parte solo a mano (Actions > Run workflow). Il file va su Google
# Drive (stessi secrets della build normale, link pubblico), come artifact
# della run, e il link viene mandato su WhatsApp. Su Drive si tengono solo
# gli ultimi 2 file PierWFC; quelli della build normale non vengono toccati.
#
# Cosa cambia rispetto alla build normale: dopo aver scaricato il pack
# ufficiale, tools/pierwfc/patch_code_pul.py modifica Binaries/Code.pul
# (dominio play.rwfc.net -> dominio PierWFC, chiave pubblica di firma
# ufficiale -> chiave pubblica del server PierWFC). Il resto e' identico.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Dominio del server PierWFC (max 15 caratteri)"
        type: string
        required: false
        default: "q7x.duckdns.org"

permissions:
  contents: read

env:
  PACK_ZIP_URL: https://update.rwfc.net/RetroRewind/zip/RetroRewind.zip
  BUILDER_MEGA_LINK: https://mega.nz/folder/yW40yJqI#l9RG4RsVWRSwoAVyXpqr4w
  # il nome cambia ogni tanto (es. "... and above fixed3.zip"): cerca per pattern
  BUILDER_ZIP: Retro Rewind ISO Builder Wiimm Edition for v6.13.0 and above*.zip
  MEGA_ISO_DIR: /iso-originale
  MEGA_ISO_NAME: ""
  WIT_URL: https://wit.wiimm.de/download/wit-v3.05a-r8638-x86_64.tar.gz
  PIERWFC_DOMAIN: ${{ github.event.inputs.domain || 'q7x.duckdns.org' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      download_url: ${{ steps.drive.outputs.download_url }}
      wbfs_name: ${{ steps.wbfsname.outputs.wbfs_name }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Installa wit (Wiimms ISO Tools)
        run: |
          curl -fsSL -o /tmp/wit.tar.gz "$WIT_URL"
          tar xzf /tmp/wit.tar.gz -C /tmp
          WITDIR=$(ls -d /tmp/wit-v3.05a* | head -n1)
          sudo install -m755 "$WITDIR/bin/wit" /usr/local/bin/wit
          wit --version

      - name: Installa MEGAcmd
        shell: bash
        run: |
          if ! command -v mega-get >/dev/null 2>&1; then
            source /etc/os-release
            DEB="megacmd-xUbuntu_${VERSION_ID}_amd64.deb"
            wget -q "https://mega.nz/linux/repo/xUbuntu_${VERSION_ID}/amd64/${DEB}" -O "/tmp/${DEB}"
            sudo apt install -y "/tmp/${DEB}"
          fi
          mega-get --version 2>&1 | head -n2 || true

      - name: Prepara il patcher (ISO Builder v6.13.0+ da MEGA)
        shell: bash
        run: |
          set -euxo pipefail
          # Link pubblico (anonimo, nessun login): contiene SEMPRE il builder
          # aggiornato con Kamek Loader v2. Quello su GitHub e' obsoleto (v1).
          # NOTA: mega-get esige una cartella di destinazione ESISTENTE.
          rm -rf /tmp/megabuilder
          mkdir -p /tmp/megabuilder
          # Retry del download MEGA (a volte mega-get si interrompe a meta'):
          # riprova fino a 3 volte, con ls diagnostico tra un tentativo e l'altro.
          for i in 1 2 3; do
            echo "Tentativo mega-get #$i..."
            if mega-get "$BUILDER_MEGA_LINK" /tmp/megabuilder; then
              echo "mega-get riuscito al tentativo #$i"
              break
            fi
            echo "mega-get fallito al tentativo #$i, contenuto parziale:"
            ls -R /tmp/megabuilder 2>/dev/null | head -n 20
            if [ "$i" = "3" ]; then
              echo "::error::mega-get fallito dopo 3 tentativi"
              exit 1
            fi
            sleep 5
          done
          ls -R /tmp/megabuilder | head -n 50
          # Trova lo zip del builder in modo dinamico (la struttura della
          # cartella MEGA upstream puo' cambiare): cerca ricorsivamente.
          BUILDER_ZIP_PATH=$(find /tmp/megabuilder -name "$BUILDER_ZIP" -print -quit 2>/dev/null)
          if [ -z "$BUILDER_ZIP_PATH" ]; then
            echo "::error::Builder zip '$BUILDER_ZIP' non trovato nella cartella MEGA scaricata. Struttura cambiata upstream?"
            find /tmp/megabuilder -name "*.zip" 2>/dev/null | head -20
            exit 1
          fi
          echo "Trovato builder: $BUILDER_ZIP_PATH"
          unzip -q -o "$BUILDER_ZIP_PATH"
          chmod a+x *.sh
          # Builder v6.13.0+: struttura con Strap.szs (non piu' Loaders/main.dol)
          test -f extra/Boot/Strap/Strap.szs || (echo "::error::extra/Boot/Strap/Strap.szs mancante"; exit 1)
          test -f copy-files.sh || (echo "::error::copy-files.sh mancante"; exit 1)
          echo "Builder v6.13.0+ OK: Strap.szs + copy-files.sh presenti"
          rm -rf /tmp/megabuilder

      - name: Scarica il pack Retro Rewind (full, RetroWFC)
        run: |
          curl -fL --retry 5 --retry-all-errors -C - -A "Mozilla/5.0" -o RetroRewind.zip "$PACK_ZIP_URL"
          unzip -q RetroRewind.zip 'RetroRewind6/*'
          rm -f RetroRewind.zip
          du -sh RetroRewind6
          test -f RetroRewind6/UI/Title.szs
          test -f RetroRewind6/Binaries/Code.pul
          test -f RetroRewind6/Binaries/Loader.pul
          echo "Pack OK: Code.pul + Loader.pul presenti (Pulsar/RetroWFC)"

      - name: Punta il client al server PierWFC (dominio + chiave)
        shell: bash
        run: |
          set -euxo pipefail
          pip install --quiet cryptography
          cp RetroRewind6/Binaries/Code.pul /tmp/Code.pul.orig
          python3 tools/pierwfc/patch_code_pul.py RetroRewind6/Binaries/Code.pul "$PIERWFC_DOMAIN" tools/pierwfc/pierwfc-public-key.pem
          # controllo: niente piu' riferimenti al server ufficiale nel client
          if grep -qa 'play.rwfc.net' RetroRewind6/Binaries/Code.pul; then
            echo "::error::play.rwfc.net ancora presente in Code.pul"; exit 1
          fi
          grep -qa "$PIERWFC_DOMAIN" RetroRewind6/Binaries/Code.pul
          cmp -s /tmp/Code.pul.orig RetroRewind6/Binaries/Code.pul && { echo "::error::Code.pul non modificato"; exit 1; } || true
          sha256sum RetroRewind6/Binaries/Code.pul

      - name: Scarica ISO base da MEGA (PAL, RMCP01)
        shell: bash
        env:
          MEGA_USERNAME: ${{ secrets.MEGA_USERNAME }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -euxo pipefail
          if [ -z "${MEGA_USERNAME:-}" ] || [ -z "${MEGA_PASSWORD:-}" ]; then
            echo "::error::Secrets MEGA_USERNAME/MEGA_PASSWORD mancanti. Impostali in Settings > Secrets."
            exit 1
          fi
          # MEGAcmd gia' installato nello step dedicato; qui serve solo il login
          # per la cartella privata /iso-originale (il builder sopra e' pubblico).
          mega-login "$MEGA_USERNAME" "$MEGA_PASSWORD"
          echo "--- Contenuto di $MEGA_ISO_DIR ---"
          mega-ls -l "$MEGA_ISO_DIR"
          # Nome file: da MEGA_ISO_NAME oppure primo .iso trovato nella cartella
          if [ -n "${MEGA_ISO_NAME:-}" ]; then
            REMOTE_FILE="$MEGA_ISO_DIR/$MEGA_ISO_NAME"
          else
            PICK=$(mega-ls "$MEGA_ISO_DIR" | grep -i '\.iso$' | head -n1 | tr -d '\r' | xargs || true)
            if [ -n "$PICK" ]; then PICK=$(basename "$PICK"); fi
            if [ -z "$PICK" ]; then
              echo "::error::Nessun file .iso trovato in $MEGA_ISO_DIR su MEGA."
              exit 1
            fi
            REMOTE_FILE="$MEGA_ISO_DIR/$PICK"
          fi
          echo "Scarico $REMOTE_FILE -> MarioKart.iso"
          mega-get "$REMOTE_FILE" ./MarioKart.iso
          mega-logout || true
          ls -lh MarioKart.iso
          # NOTA: `wit INFO` stampa keywords interne, NON le ISO. Per le ISO usare LIST/ID6.
          wit LIST MarioKart.iso 2>&1 | head -n 30
          wit ID6 MarioKart.iso 2>&1 | grep -q "RMCP01" || (echo "::error::La ISO base da MEGA non contiene RMCP01 (PAL). Controlla il file in $MEGA_ISO_DIR."; exit 1)

      - name: Compila l'ISO patchata (manuale, builder v6.13.0)
        shell: bash
        run: |
          set -euxo pipefail
          df -h .
          rm -rf workdir.tmp new-image
          # 1. Estrai ISO base
          wit extract MarioKart.iso --DEST workdir.tmp --psel data --links --include RMCP01 -vv1 -F-.svn/
          test -d workdir.tmp
          test -f workdir.tmp/setup.txt
          rm -f MarioKart.iso
          # 2. Copia i file Retro Rewind (pack) in workdir.tmp/files/
          #    Il pack RetroRewind6/ contiene Binaries/, UI/, Race/, ecc.
          test -d RetroRewind6 || (echo "::error::RetroRewind6/ mancante"; exit 1)
          cp -r RetroRewind6/* workdir.tmp/files/
          echo "Pack copiato in workdir.tmp/files/"
          # 3. Copia i file extra del builder (Strap.szs, bi2.bin, ecc.)
          #    extra/Boot/Strap/Strap.szs -> workdir.tmp/files/Boot/Strap/ ?
          #    Proviamo le posizioni standard
          if [ -d extra ]; then
            echo "Contenuto extra/:"
            find extra -type f | head -20
            # Copia ricorsiva: extra/* -> workdir.tmp/files/
            # (la struttura extra/ rispecchia quella di files/)
            cp -r extra/* workdir.tmp/files/ 2>/dev/null || true
            echo "Extra copiato"
          fi
          # 4. Verifica file chiave
          echo "--- Verifica ---"
          test -f workdir.tmp/files/Binaries/Code.pul || (echo "::error::Code.pul mancante"; exit 1)
          test -f workdir.tmp/files/Binaries/Loader.pul || (echo "::error::Loader.pul mancante"; exit 1)
          ls workdir.tmp/files/Binaries/
          # 5. Ricostruisci WBFS
          OUT="Mario Kart Wii(Retro Rewind PierWFC)-Aggiornamento $(date -u +%d-%m-%Y).wbfs"
          echo "Nome output: $OUT"
          mkdir -p new-image
          wit copy workdir.tmp -T0 --DEST "new-image/$OUT" -ovv --links \
            --id RMCPTO --ticket-id=RMCR --tmd-id=RMCR --boot-id=RMCP \
            --security-fix --name "Mario Kart Retro Rewind PierWFC" --wbfs
          echo "OUTPUT_WBFS=$OUT" >> "$GITHUB_ENV"
          ls -lh new-image
          df -h .

      - name: Verifica file finale (RetroWFC, niente patch Wiimmfi)
        shell: bash
        run: |
          set -euxo pipefail
          WBFS="new-image/$OUTPUT_WBFS"
          test -f "$WBFS"
          # NOTA: `wit INFO` non legge le immagini. LIST/ID6/FILES si'.
          echo "=== $WBFS (Dolphin + Wii) ==="
          wit LIST -l "$WBFS" 2>&1 | tee /tmp/wit-info.txt
          grep -q "RMCPTO" /tmp/wit-info.txt || (echo "::error::GameID RMCPTO non trovato"; exit 1)
          grep -q "Mario Kart Retro Rewind PierWFC" /tmp/wit-info.txt || (echo "::error::Nome atteso non trovato"; exit 1)
          wit ID6 "$WBFS" 2>&1 | grep -q "RMCPTO" || (echo "::error::ID RMCPTO non trovato nel WBFS"; exit 1)
          echo "--- Filelist (controllo Retro Rewind) ---"
          wit FILES "$WBFS" 2>&1 | tee /tmp/wit-files.txt | head -n 50
          # La build deve contenere i file Pulsar/Retro (almeno Binaries + Course).
          # `wit FILES` elenca i percorsi interni; accettiamo sia formati con
          # prefisso "/" sia senza.
          grep -q "Binaries/Code.pul\|files/Binaries/Code.pul\|/Binaries/" /tmp/wit-files.txt \
            || (echo "::warning::Code.pul non visibile in wit FILES, controllo con FILELIST"; wit FILELIST "$WBFS" 2>&1 | grep -q "Code.pul" || (echo "::error::Code.pul assente nella build finale"; exit 1))
          echo "OK: $OUTPUT_WBFS (Dolphin + Wii) con ID RMCPTO e file Retro Rewind."
          echo "Server online: PierWFC ($PIERWFC_DOMAIN), nessuna patch Wiimmfi applicata."
          {
            echo "## Verifica build"
            echo "- File unico: \`$OUTPUT_WBFS\` ($(du -h "$WBFS" | cut -f1)) per Dolphin E Wii (sulla USB in \`/wbfs/\`; se il forwarder cerca \`RMCPTO.wbfs\`, rinominalo cosi)"
            echo "- GameID: \`RMCPTO\` (base PAL RMCP01)"
            echo "- Builder: ufficiale v6.13.0+ (Strap.szs)"
            echo "- Pulsar: \`Binaries/Code.pul\` + \`Loader.pul\` presenti"
            echo "- Server: PierWFC ($PIERWFC_DOMAIN), nessuna patch Wiimmfi"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Carica il WBFS come artifact
        uses: actions/upload-artifact@v4
        with:
          name: retro-rewind-pierwfc-wbfs
          path: new-image/*.wbfs
          retention-days: 7
          compression-level: 0

      - name: Upload WBFS su Google Drive (link per WhatsApp)
        id: drive
        # se Drive fallisce (es. token scaduto) il file resta comunque come artifact
        continue-on-error: true
        shell: bash
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          WBFS="new-image/$OUTPUT_WBFS"
          # 1. access token dal refresh token
          AT=$(curl -fsSL -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=$DRIVE_REFRESH_TOKEN" \
            --data-urlencode "client_id=$DRIVE_CLIENT_ID" \
            --data-urlencode "client_secret=$DRIVE_CLIENT_SECRET" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          # 2. upload del file in streaming (uploadType=media con --upload-file:
          # NON usare --data-binary multipart: caricherebbe i 3,3 GB in RAM)
          FID=$(curl -fsSL -X POST -T "$WBFS" \
            "https://www.googleapis.com/upload/drive/v3/files?uploadType=media&fields=id" \
            -H "Authorization: Bearer $AT" \
            -H "Content-Type: application/octet-stream" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "File caricato su Drive, ID: $FID"
          # 2b. imposta il nome file (uploadType=media non accetta metadati)
          META=$(python3 -c "import json; print(json.dumps({'name': '$OUTPUT_WBFS'}))")
          curl -fsSL -X PATCH "https://www.googleapis.com/drive/v3/files/$FID" \
            -H "Authorization: Bearer $AT" -H "Content-Type: application/json" \
            -d "$META" > /dev/null
          # 3. link pubblico (chiunque abbia il link puo' leggere)
          curl -fsSL -X POST "https://www.googleapis.com/drive/v3/files/$FID/permissions" \
            -H "Authorization: Bearer $AT" -H "Content-Type: application/json" \
            -d '{"type":"anyone","role":"reader"}' > /dev/null
          URL=$(curl -fsSL "https://www.googleapis.com/drive/v3/files/$FID?fields=webViewLink" \
            -H "Authorization: Bearer $AT" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['webViewLink'])")
          echo "Link Drive: $URL"
          echo "download_url=$URL" >> "$GITHUB_OUTPUT"
          # 4. pulizia: tengo solo i 2 file piu' recenti (quota Drive limitata; solo file PierWFC, quelli della build normale non si toccano)
          IDS=$(curl -fsSL "https://www.googleapis.com/drive/v3/files?pageSize=10&orderBy=createdTime%20desc&fields=files(id)&q=name%20contains%20%27PierWFC%27%20and%20trashed%3Dfalse" \
            -H "Authorization: Bearer $AT" \
            | python3 -c "
          import sys, json
          ids = [f['id'] for f in json.load(sys.stdin).get('files', [])]
          print(' '.join(ids[2:]))
          ")
          for OLD in $IDS; do
            [ "$OLD" = "$FID" ] && continue
            if curl -fsSL -X DELETE "https://www.googleapis.com/drive/v3/files/$OLD" \
              -H "Authorization: Bearer $AT" > /dev/null; then
              echo "Rimosso vecchio file da Drive: $OLD"
            fi
          done

      - name: Esponi nome WBFS per la notifica
        id: wbfsname
        shell: bash
        run: echo "wbfs_name=$OUTPUT_WBFS" >> "$GITHUB_OUTPUT"

  notify-whatsapp:
    # Invio WhatsApp del .wbfs appena buildato via OpenWA, che gira
    # DIRETTAMENTE sul runner (niente VPS, niente Baileys diretto):
    # il server parte in locale, la sessione viene ripristinata dal secret
    # OPENWA_BAILEYS_CREDS_B64 e l'invio avviene via API REST su 127.0.0.1.
    # Gira solo se la build e' andata a buon fine (o in modalita test_whatsapp).
    # Secrets richiesti: OPENWA_API_KEY, OPENWA_BAILEYS_CREDS_B64 (creds.json
    # Baileys in base64), WA_GROUP_ID (gia' esistente).
    # NESSUNA credenziale nel repo.
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: openwa-notify
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache npm (dipendenze OpenWA)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-openwa-v1

      - name: Clona e compila OpenWA
        run: |
          set -euxo pipefail
          rm -rf openwa
          git clone --depth 1 https://github.com/rmyndharis/OpenWA openwa
          cd openwa
          # Niente Chromium: usiamo solo il motore Baileys
          export PUPPETEER_SKIP_DOWNLOAD=1
          npm ci --no-audit --no-fund --loglevel=error
          npm run build

      - name: Avvia OpenWA e invia notifica
        env:
          OPENWA_API_KEY: ${{ secrets.OPENWA_API_KEY }}
          OPENWA_BAILEYS_CREDS_B64: ${{ secrets.OPENWA_BAILEYS_CREDS_B64 }}
          WA_GROUP_ID: ${{ secrets.WA_GROUP_ID }}
          DRIVE_URL: ${{ needs.build.outputs.download_url }}
          WBFS_NAME: ${{ needs.build.outputs.wbfs_name }}
        run: |
          set -euo pipefail
          cd openwa
          mkdir -p data
          printf 'ENGINE_TYPE=baileys\nPORT=2785\n' > .env
          # La chiave API va passata via API_MASTER_KEY al primo avvio
          # (data/.api-key viene scritto dal server, non letto)
          API_MASTER_KEY="$OPENWA_API_KEY" node dist/main.js > ../openwa-server.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          API="http://127.0.0.1:2785"
          # 1. attesa avvio server con motore baileys
          for i in $(seq 1 24); do
            if curl -sf -m 5 -H "x-api-key: $OPENWA_API_KEY" \
                "$API/api/infra/engines/current" 2>/dev/null | grep -q baileys; then
              echo "OpenWA avviato (motore baileys)"
              break
            fi
            sleep 5
            if [ "$i" = 24 ]; then
              echo "::error::OpenWA non partito in tempo"
              tail -n 30 ../openwa-server.log || true
              exit 1
            fi
          done
          # 2. crea sessione e ripristina le credenziali Baileys dal secret
          SID=$(curl -sf -m 15 -X POST -H "x-api-key: $OPENWA_API_KEY" \
            -H 'Content-Type: application/json' -d '{"name":"retro-rewind"}' \
            "$API/api/sessions" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "sessione: $SID"
          mkdir -p "data/baileys/$SID"
          printf '%s' "$OPENWA_BAILEYS_CREDS_B64" | base64 -d > "data/baileys/$SID/creds.json"
          chmod 600 "data/baileys/$SID/creds.json"
          curl -sf -m 15 -X POST -H "x-api-key: $OPENWA_API_KEY" \
            "$API/api/sessions/$SID/start" > /dev/null
          # 3. attesa connessione a WhatsApp
          for i in $(seq 1 36); do
            ST=$(curl -s -m 10 -H "x-api-key: $OPENWA_API_KEY" \
              "$API/api/sessions/$SID" 2>/dev/null \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','?'))" 2>/dev/null || echo "?")
            echo "stato sessione: $ST"
            [ "$ST" = ready ] && break
            if [ "$ST" = qr_ready ] || [ "$ST" = failed ]; then
              echo "::error::sessione WhatsApp non ripristinata (stato $ST): rigenerare il secret OPENWA_BAILEYS_CREDS_B64"
              exit 1
            fi
            sleep 5
            if [ "$i" = 36 ]; then
              echo "::error::timeout connessione WhatsApp"
              exit 1
            fi
          done
          # 4. invio messaggio al gruppo
          MSG="Retro Rewind PierWFC (server personale) pronta: ${WBFS_NAME:-file .wbfs}"
          if [ -n "${DRIVE_URL:-}" ]; then
            MSG=$(printf '%s\nDownload: %s' "$MSG" "$DRIVE_URL")
          fi
          BODY=$(python3 -c "import json,sys; print(json.dumps({'chatId': sys.argv[1], 'text': sys.argv[2]}))" \
            "$WA_GROUP_ID" "$MSG")
          RESP=$(curl -sf -m 30 -X POST -H "x-api-key: $OPENWA_API_KEY" \
            -H 'Content-Type: application/json' -d "$BODY" \
            "$API/api/sessions/$SID/messages/send-text")
          echo "inviato: $RESP"
