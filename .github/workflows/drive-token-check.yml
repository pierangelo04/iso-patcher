name: Drive token check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Lista file e link
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: |
          AT=$(curl -s -X POST https://oauth2.googleapis.com/token -d grant_type=refresh_token -d refresh_token=$DRIVE_REFRESH_TOKEN -d client_id=$DRIVE_CLIENT_ID -d client_secret=$DRIVE_CLIENT_SECRET | jq -r .access_token)
          curl -s -H "Authorization: Bearer $AT" "https://www.googleapis.com/drive/v3/files?orderBy=createdTime%20desc&pageSize=20&fields=files(id,name,size,createdTime,webViewLink,trashed)" | jq -c '.files[]'
