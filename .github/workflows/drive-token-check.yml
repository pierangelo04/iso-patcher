name: Drive token check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Prova refresh token Drive (non stampa il token)
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: |
          curl -sS -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=$DRIVE_REFRESH_TOKEN" \
            --data-urlencode "client_id=$DRIVE_CLIENT_ID" \
            --data-urlencode "client_secret=$DRIVE_CLIENT_SECRET" \
            -w "\nHTTP %{http_code}\n" | sed -E 's/"(access_token|id_token)": *"[^"]*"/"\1":"<hidden>"/'
