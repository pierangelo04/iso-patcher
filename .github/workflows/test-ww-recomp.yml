name: Test WiiCompiled tramite Wheel Wizard 2.6.4 reale

# Test singolo, solo branch ww-overlay-test. Nessun merge, nessun upload su Drive, nessuna VPS.
# Repo pubblico: log/artifact pubblici. Non si carica ISO, pack o credenziali: solo screenshot e riepiloghi filtrati.
# Isolamento: i secrets MEGA esistono SOLO nel passo che scarica la base; poi la sessione MEGA viene
# cancellata. Il binario terzo gira dopo, senza secrets e senza token nell'ambiente.

on:
  push:
    branches: [ww-overlay-test]
    paths: [".github/workflows/test-ww-recomp.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  WC_TAG: v0.9.3
  WC_ASSET: WiiCompiled-Setup-x86_64.AppImage
  WC_SHA256: 4b2d5875b0f625b84a03a06fca0ef11bbbf401f6680c924f08fcb29248196486
  WC_URL: https://github.com/patchzyy/Wiicompiled/releases/download/v0.9.3/WiiCompiled-Setup-x86_64.AppImage
  PACK_ZIP_URL: https://update.rwfc.net/RetroRewind/zip/RetroRewind.zip
  WIT_URL: https://wit.wiimm.de/download/wit-v3.05a-r8638-x86_64.tar.gz
  MEGA_ISO_DIR: /iso-originale

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepara strumenti
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          mkdir -p work shots
          curl -fsSL -o /tmp/wit.tar.gz "$WIT_URL"; tar xzf /tmp/wit.tar.gz -C /tmp
          sudo install -m755 "$(ls -d /tmp/wit-v3.05a* | head -n1)/bin/wit" /usr/local/bin/wit
          source /etc/os-release
          DEB="megacmd-xUbuntu_${VERSION_ID}_amd64.deb"
          wget -q "https://mega.nz/linux/repo/xUbuntu_${VERSION_ID}/amd64/${DEB}" -O "/tmp/${DEB}"
          sudo apt-get update -qq; sudo apt-get install -y "/tmp/${DEB}" >/dev/null
          sudo apt-get install -y --no-install-recommends xvfb xdotool imagemagick tcpdump tesseract-ocr openbox libicu-dev libfontconfig1 libice6 libsm6 libgl1 mesa-vulkan-drivers libgl1-mesa-dri libvulkan1 libegl1 >/dev/null

      - name: Base vanilla da MEGA (unico passo con secrets)
        env:
          MEGA_USERNAME: ${{ secrets.MEGA_USERNAME }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -eu
          mega-login "$MEGA_USERNAME" "$MEGA_PASSWORD" >/dev/null 2>&1
          PICK=$(mega-ls "$MEGA_ISO_DIR" 2>/dev/null | grep -i '\.iso$' | head -n1 | tr -d '\r' | xargs)
          mega-get "$MEGA_ISO_DIR/$(basename "$PICK")" work/base.iso >/dev/null 2>&1
          mega-logout >/dev/null 2>&1 || true
          mega-quit >/dev/null 2>&1 || true
          rm -rf "$HOME/.megaCmd" "$HOME"/.megaCmd* "$HOME"/.mega* 2>/dev/null || true
          echo "base id6=$(wit ID6 work/base.iso | head -n1) size=$(stat -c %s work/base.iso)"
          pgrep -a mega || true

      - name: Cartella Retro Rewind ufficiale (come la prepara WW)
        run: |
          set -eu
          cd work
          curl -fL --retry 5 --retry-all-errors -A "Mozilla/5.0" -o rr.zip "$PACK_ZIP_URL"
          mkdir rrsrc && unzip -q rr.zip 'RetroRewind6/*' 'riivolution/RetroRewind6.xml' -d rrsrc
          rm -f rr.zip; du -sh rrsrc

      - name: Wheel Wizard 2.6.4 reale con WiiCompiled (beta) abilitato (config pre-seminata)
        run: |
          set -u
          W=$PWD/work; OUT=$PWD/shots; mkdir -p $W/user/Config $W/Load/Riivolution/WheelWizard $W/run/CT-MKWII $W/home
          cp -a $W/rrsrc/RetroRewind6 $W/Load/Riivolution/WheelWizard/; mkdir -p $W/Load/Riivolution/WheelWizard/riivolution; cp $W/rrsrc/riivolution/RetroRewind6.xml $W/Load/Riivolution/WheelWizard/riivolution/ 2>/dev/null || true
          ln -sfn $W/Load $W/user/Load
          cat > $W/run/CT-MKWII/config.json <<CFG
          {
            "UserFolderPath": "$W/user",
            "GameLocation": "$W/base.iso",
            "EnableRecomp": true,
            "LaunchRrOnStartup": true,
            "ForceWiimote": false
          }
          CFG
          sed -i 's/^          //' $W/run/CT-MKWII/config.json
          RH=$(getent passwd $(id -un) | cut -d: -f6); mkdir -p $RH/.config/CT-MKWII; cp $W/run/CT-MKWII/config.json $RH/.config/CT-MKWII/config.json
          curl -fsSL -o $W/run/WheelWizard_Linux https://github.com/TeamWheelWizard/WheelWizard/releases/download/v2.6.4/WheelWizard_Linux; chmod +x $W/run/WheelWizard_Linux
          sha256sum $W/run/WheelWizard_Linux | cut -c1-64 | tee $OUT/ww-sha256.txt
          export HOME=$W/home DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy APPIMAGE_EXTRACT_AND_RUN=1 AVALONIA_GLOBAL_SCALE_FACTOR=1
          Xvfb :99 -screen 0 1280x800x24 & sleep 3; openbox >/dev/null 2>&1 & sleep 2
          sudo tcpdump -i any -nn -l 'udp port 53 or (tcp[tcpflags] & tcp-syn != 0)' > net-raw.txt 2>/dev/null &
          (cd $W/run && timeout 3000 ./WheelWizard_Linux > $OUT/ww-stdout.log 2>&1) &
          cat > $W/drive.py <<'PYEOF'
          import subprocess as sp, time, os, re, sys
          OUT=sys.argv[1]; N=int(sys.argv[2])
          def run(c): return sp.run(c,shell=True,text=True,stdout=sp.PIPE,stderr=sp.STDOUT).stdout
          clicks={}
          # (frase da cercare, max click, parole da non cliccare)
          RULES=[("make a copy",2),("install",3),("continue",3),("yes",2),("ok",2),("play",3),("launch",3)]
          log=open(OUT+"/driver.log","a")
          last=0
          for i in range(1,N+1):
              time.sleep(20)
              p=f"{OUT}/s-{i:03d}.png"
              run(f"import -window root {p}")
              run(f"convert {p} -resize 200% /tmp/o.png")
              tsv=run("tesseract /tmp/o.png - --psm 11 tsv 2>/dev/null").splitlines()
              words=[]
              for l in tsv[1:]:
                  f=l.split("\t")
                  if len(f)>=12 and f[11].strip() and float(f[10])>50:
                      words.append((f[11].strip().lower().strip(".,:!"),int(f[6])//2,int(f[7])//2,int(f[8])//2,int(f[9])//2))
              txt=" ".join(w[0] for w in words)
              procs=run("ps -eo comm,args | grep -i -E 'wiicompiled|RetroRewind|mkw|Wheel' | grep -v grep | cut -c1-80 | head -4").replace(chr(10)," | ")
              log.write(f"[{i}] words={len(words)} procs={procs} text={txt[:200]}\n"); log.flush()
              if time.time()-last<40: continue
              for key,mx in RULES:
                  if clicks.get(key,0)>=mx: continue
                  keys=key.split()
                  for j,w in enumerate(words):
                      if w[0]==keys[0] and all(j+k<len(words) and words[j+k][0]==keys[k] for k in range(len(keys))):
                          # non cliccare "install offline-only", "use directly", "share"
                          nxt=words[j+1][0] if j+1<len(words) else ""
                          if key=="install" and nxt=="offline-only": continue
                          if key=="install" and w[2]<150: continue
                          cx=w[1]+w[3]//2; cy=w[2]+w[4]//2
                          run(f"xdotool mousemove {cx} {cy} click 1")
                          clicks[key]=clicks.get(key,0)+1; last=time.time()
                          log.write(f"  CLICK {key} at {cx},{cy}\n"); log.flush(); break
                  else: continue
                  break
          PYEOF
          sed -i 's/^          //' $W/drive.py
          sleep 60; xdotool mousemove 516 587 click 1 || true; sleep 5; xdotool mousemove 516 587 click 1 || true
          python3 $W/drive.py $OUT 120
          tail -c 2500 $OUT/ww-stdout.log | sed 's#/home/[^ ]*#<home>#g' > $OUT/ww-stdout-tail.txt
          sudo pkill tcpdump || true
          { echo "== DNS"; grep -a -o 'A? [A-Za-z0-9._-]*' net-raw.txt | awk '{print $2}' | sort | uniq -c | sort -rn | grep -v githubapp | head -30; echo "== processi"; ps aux | grep -i -E 'wiicompiled|RetroRewind|Wheel' | grep -v grep | awk '{print $11,$12}' | head; } | tee $OUT/net-summary.txt

      - name: Pulizia ISO
        if: always()
        run: rm -rf work/base.iso net-raw.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ww-recomp-shots
          path: shots/
          retention-days: 3
